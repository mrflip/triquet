# Semi-linear history: a PR branch may not contain merge commits.
# Paired with "Require branches to be up to date before merging" in the
# main ruleset, every PR is a straight run of commits on top of current main,
# and lands as a single merge commit. See notes/git_hygiene.md.
name: semi-linear
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  no-merges-in-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject merge commits in the branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE_SHA"..HEAD)
          if [ -n "$merges" ]; then
            echo "::error::Branch contains merge commits. Rebase instead: git fetch origin && git rebase origin/main"
            git log --oneline --no-walk $merges
            exit 1
          fi