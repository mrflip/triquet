name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress: only the latest
# commit's result matters there. Other runs (pushes to main) each get a group of their own, by
# run id, so none is ever cancelled or held back and every commit to main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every `run` step heads and closes its log with the time and how far into the job it is
# (scripts/ci_step), counted from the JOB_STARTED each job's first step notes. A step before the
# checkout has no scripts/ to run in, and says `shell: bash` for itself.
defaults:
  run:
    shell: bash scripts/ci_step {0}

# Few jobs, each doing several checks: a pull request's run takes eight runners at once, and the
# account has twenty, which a push of the spine shares among every pull request on it. Within a
# job every check runs whatever an earlier one found, so one failure never hides another, and
# the job fails if any did. The two quick jobs are the ones the ruleset requires; they take about
# as long as each other, and less than the slowest e2e shard.
jobs:
  # Lint first, as the likelier of the two to fail for a reason worth reading, then typecheck, then
  # keep a pull request's history semi-linear (notes/git_hygiene.md): its branch may hold no merge
  # commit. The whole history is fetched for that, a few seconds at this size.
  lint-typecheck:
    runs-on: ubuntu-26.04
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Reject merge commits in the branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE_SHA..$HEAD_SHA")
          if [ -n "$merges" ]; then
            echo "::error::Branch contains merge commits. Rebase instead: git fetch origin && git rebase origin/main"
            git log --oneline --no-walk $merges
            exit 1
          fi

  # The unit tests, then the build, both on the checkout as committed; then a check that
  # convex/_generated/ is as the functions regenerate it. It is committed, and a push regenerates
  # it, so this pushes to a local backend of its own (the binary cached as the e2e job caches it)
  # and diffs. Last, because the push rewrites those files in place.
  test-generated-build:
    runs-on: ubuntu-26.04
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
        # Baked into the page at build, never connected to: any URL will do.
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3402
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-backend-${{ runner.os }}-${{ hashFiles('scripts/convex_backend') }}
      - id: generate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: scripts/convex_dev e2e true
      - if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: git diff --exit-code --stat convex/_generated

  # The suite split six ways, each shard on a runner of its own, against the optimized build
  # (`next build`, then `next start`) rather than the dev server: the mode the app is deployed in,
  # and no page waits to compile on first visit. Each shard builds for itself. `pnpm
  # test:e2e:built --shard=2/6` runs one shard's specs locally against the build. Every shard runs
  # to the end, so one failure never hides another.
  e2e:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # A bound for when something hangs: GitHub's own is six hours.
    timeout-minutes: 20
    # What Doppler's dev_e2e config gives a local run, the e2e role's port, backend and build
    # directory; e2e/environment.setup.ts checks them. The web server Playwright starts brings up
    # a local Convex backend of its own (scripts/convex_dev), and TRIQUET_E2E_SERVER has it serve
    # the optimized build, which it makes first (e2e/environment.ts).
    env:
      PORT: 3002
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3402
      NEXT_DIST_DIR: .next-e2e
      TRIQUET_E2E_SERVER: built
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Convex backend binary scripts/convex_backend pins, kept between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-backend-${{ runner.os }}-${{ hashFiles('scripts/convex_backend') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # The html report holds each failure's trace, screenshot and log; `pnpm exec playwright
      # show-report` opens it once downloaded and unzipped.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
