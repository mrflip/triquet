name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress: only the latest
# commit's result matters there. Other runs (pushes to main) each get a group of their own, by
# run id, so none is ever cancelled or held back and every commit to main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-26.04
    # Baked into the page at build, never connected to: any URL will do.
    env:
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3402
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # convex/_generated/ is committed, and a push regenerates it: a checkout whose functions or
  # schema changed without it fails here. Codegen needs a running deployment, so the job pushes
  # to a local backend of its own (the binary cached as the e2e job caches it) and diffs.
  generated:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-backend-${{ runner.os }}-${{ hashFiles('scripts/convex_backend') }}
      - run: scripts/convex_dev e2e true
      - run: git diff --exit-code --stat convex/_generated

  # The suite split six ways, each shard on a runner and dev server of its own; `pnpm test:e2e
  # --shard=2/6` runs one shard's specs locally. Every shard runs to the end, so one failure
  # never hides another.
  e2e:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # A bound for when something hangs: GitHub's own is six hours.
    timeout-minutes: 20
    # What Doppler's dev_e2e config gives a local run; e2e/environment.setup.ts checks them. The
    # web server Playwright starts brings up a local Convex backend of its own (scripts/convex_dev).
    env:
      PORT: 3002
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3402
      NEXT_DIST_DIR: .next-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Convex backend binary scripts/convex_backend pins, kept between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/convex/binaries
          key: convex-backend-${{ runner.os }}-${{ hashFiles('scripts/convex_backend') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # The html report holds each failure's trace, screenshot and log; `pnpm exec playwright
      # show-report` opens it once downloaded and unzipped.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
