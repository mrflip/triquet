<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trivia Ambiguity Audit (Copy)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="page-style">
  :root {
    --bg: #eef1ea;
    --surface: #ffffff;
    --surface-2: #e4e9e0;
    --ink: #1b2b28;
    --muted: #5b6b66;
    --border: #d7ddd0;
    --accent: #b8790f;
    --accent-ink: #6b4a0e;
    --accent-soft: #f5e7c8;
    --good: #2f6f4f;
    --good-soft: #dcece0;
    --bad: #ad3f2b;
    --bad-soft: #f5ded7;
    --radius: 10px;
    --font-display: 'Zilla Slab', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12201c;
      --surface: #1b2b26;
      --surface-2: #21322c;
      --ink: #e9f0ec;
      --muted: #93aba3;
      --border: #2c3f38;
      --accent: #e0a63a;
      --accent-ink: #f5e2b8;
      --accent-soft: #33290f;
      --good: #74c495;
      --good-soft: #1e3629;
      --bad: #e08a76;
      --bad-soft: #3a2620;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12201c;
    --surface: #1b2b26;
    --surface-2: #21322c;
    --ink: #e9f0ec;
    --muted: #93aba3;
    --border: #2c3f38;
    --accent: #e0a63a;
    --accent-ink: #f5e2b8;
    --accent-soft: #33290f;
    --good: #74c495;
    --good-soft: #1e3629;
    --bad: #e08a76;
    --bad-soft: #3a2620;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    padding-block: 28px 48px;
  }
  #app { max-width: none; margin: 0; display: flex; flex-direction: column; gap: 20px; }

  h1, .title-input { font-family: var(--font-display); }

  .topbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .eyebrow {
    font: 600 .72rem/1 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 5px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .title-input {
    flex: 1 1 320px;
    min-width: 0;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 2px 4px;
    text-wrap: balance;
  }
  .title-input:hover { border-bottom-color: var(--border); }
  .title-input:focus-visible {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .title-input::placeholder { color: var(--muted); font-weight: 500; }

  .topbar-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: .82rem;
    color: var(--muted);
  }
  .hint { max-width: 52ch; }
  .save-status {
    font: 500 .75rem/1 var(--font-body);
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .save-status:empty { display: none; }
  .save-status[data-state="pending"] { background: var(--surface-2); color: var(--muted); }
  .save-status[data-state="saving"] { background: var(--accent-soft); color: var(--accent-ink); }
  .save-status[data-state="local-only"], .save-status[data-state="error"] { background: var(--bad-soft); color: var(--bad); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
  }
  table.quiz-table { width: 100%; border-collapse: collapse; min-width: 2260px; table-layout: fixed; }
  .quiz-table th {
    text-align: left;
    font: 600 .72rem/1.2 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .quiz-table th:first-child { border-top-left-radius: var(--radius); }
  .quiz-table th:last-child { border-top-right-radius: var(--radius); }
  .quiz-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .quiz-table tbody tr:last-child td { border-bottom: none; }
  /* The drag column always exists (so every row's cells still line up with
     the same <col> they were written for) — it's just collapsed to zero
     width and padding when not in use, rather than display:none, which
     would drop it from the column count and shift every later cell one
     column to the left. */
  .quiz-table col.col-drag { width: 0; }
  .quiz-table .drag-th, .quiz-table .drag-cell { padding: 0; overflow: hidden; }
  .quiz-table.drag-enabled col.col-drag { width: 32px; }
  .quiz-table.drag-enabled .drag-th, .quiz-table.drag-enabled .drag-cell { padding: 12px 14px; overflow: visible; }
  .drag-cell { text-align: center; color: var(--muted); cursor: grab; user-select: none; font-size: 1.1rem; }
  .drag-cell:active { cursor: grabbing; }
  .quiz-table tbody tr.dragging { opacity: .4; }
  .quiz-table tbody tr.drag-over td { box-shadow: inset 0 2px 0 var(--accent); }
  .quiz-table col.col-qnum { width: 60px; }
  .quiz-table col.col-q { width: 330px; }
  .quiz-table col.col-sa { width: 100px; }
  .quiz-table col.col-chain { width: 120px; }
  .quiz-table col.col-hint { width: 330px; }
  .quiz-table col.col-butnot { width: 180px; }
  .quiz-table col.col-ai { width: 160px; }
  .quiz-table col.col-sum { width: 78px; }
  .quiz-table col.col-side { width: 220px; }
  .quiz-table col.col-ishes { width: 170px; }

  .qnum-input {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: .9rem;
    padding: 6px 5px;
    text-align: center;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .qnum-input::-webkit-inner-spin-button,
  .qnum-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .qnum-input:hover { border-color: var(--border); }
  .qnum-input:focus-visible { outline: none; border-color: var(--accent); background: var(--surface-2); }

  .quiz-table th.sortable-th { cursor: pointer; user-select: none; }
  .quiz-table th.sortable-th:hover { color: var(--ink); }
  .quiz-table th.sortable-th-last { font-weight: 700; color: var(--ink); }
  .sort-arrow { display: inline-block; margin-left: 4px; opacity: .8; }
  .quiz-table th.vheader {
    writing-mode: vertical-lr;
    white-space: nowrap;
    text-align: left;
    padding-block: 10px;
    vertical-align: bottom;
  }
  .quiz-table th.vheader .sort-arrow { margin-left: 0; margin-top: 4px; }
  .quiz-table th.sortable-th-centered {
    text-align: center;
    vertical-align: bottom;
    white-space: normal;
  }

  .q-input, .sa-input {
    width: 100%;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: .92rem;
    line-height: 1.4;
    padding: 6px 7px;
  }
  /* Height is set inline by syncClueHeight() (min 10.5em, growing with content up
     to a generous cap) rather than by resize/min-height alone, so a long clue or
     hint can drive the row taller instead of immediately scrolling; overflow-y
     only starts showing a scrollbar once content actually exceeds that cap. */
  .q-input { min-height: 10.5em; overflow-y: auto; }
  .sa-input { font-family: var(--font-mono); font-size: .88rem; }
  .hint-input { min-height: 10.5em; overflow-y: auto; }
  .q-input:hover, .sa-input:hover, .hint-input:hover { border-color: var(--border); }
  .q-input:focus-visible, .sa-input:focus-visible, .hint-input:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-2);
  }
  .q-input::placeholder, .sa-input::placeholder, .hint-input::placeholder { color: var(--muted); }

  .chain-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: .85rem;
    padding: 6px 7px;
  }
  .chain-select:focus-visible { outline: none; border-color: var(--accent); }

  .butnot-cell {
    font-family: var(--font-mono);
    font-size: .86rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .butnot-placeholder {
    color: var(--muted);
    font-family: var(--font-body);
    font-style: italic;
    font-size: .88rem;
  }

  .guess-cell, .numberish-cell {
    cursor: pointer;
    border-radius: 6px;
    padding-inline: 4px;
    min-height: 3.2em;
  }
  .guess-cell:hover, .numberish-cell:hover { background: var(--surface-2); }
  .guess-body {
    font-family: var(--font-mono);
    font-size: .88rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .guess-empty {
    color: var(--muted);
    font-family: var(--font-body);
    font-style: italic;
  }
  .guess-loading { color: var(--accent-ink); font-family: var(--font-body); }
  .guess-error { color: var(--bad); font-family: var(--font-body); }
  .guess-done { color: var(--ink); }
  .guess-meta {
    margin-top: 5px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font: 500 .68rem/1.2 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .tok-badge {
    font-variant-numeric: tabular-nums;
    opacity: .75;
    cursor: help;
  }
  .refresh-btn {
    font: 600 .64rem/1 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--accent-ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    cursor: pointer;
    margin-left: auto;
  }
  .refresh-btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .numberish-cell { min-height: 3.2em; }
  .numberish-cell-static { min-height: 3.2em; }
  /* The ishes columns never drive row height themselves — syncClueHeight() caps
     this wrapper's max-height at whatever the row's clue/hint boxes settled on,
     so a long list scrolls internally instead of stretching the row further. */
  .ish-scroll { overflow-y: auto; }
  .numberish-list {
    font-family: var(--font-mono);
    font-size: .82rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .numberish-item { display: flex; gap: 6px; }
  .numberish-item .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .numberish-item .val::before { content: "\2192"; margin-right: 6px; opacity: .6; }
  .numberish-empty { color: var(--muted); font-family: var(--font-body); font-style: italic; font-size: .88rem; }

  .quiz-table .sum-cell { font-family: var(--font-mono); text-align: right; overflow-wrap: break-word; padding-inline: 7px; }
  .sum-value {
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .sum-empty { color: var(--muted); font-size: .88rem; }

  .add-row-btn {
    align-self: flex-start;
    font: 600 .88rem/1 var(--font-body);
    color: var(--accent-ink);
    background: var(--accent-soft);
    border: 1px solid transparent;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .add-row-btn:hover { filter: brightness(0.97); }
  .add-row-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toolbar-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar-spacer { flex: 1 1 auto; }

  .recalc-ishes-btn {
    font: 600 .82rem/1 var(--font-body);
    color: var(--muted);
    background: transparent;
    border: 1px dashed var(--border);
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .recalc-ishes-btn:hover { color: var(--ink); border-color: var(--ink); }
  .recalc-ishes-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .recalc-ishes-btn:disabled { opacity: .6; cursor: default; }
  .recalc-notice { color: var(--muted); font-family: var(--font-body); font-style: italic; font-size: .85rem; }

  .chain-order-btn {
    font: 600 .88rem/1 var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chain-order-btn:hover { background: var(--surface-2); }
  .chain-order-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chain-order-btn.active { border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .renumber-btn {
    font: 600 .88rem/1 var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .renumber-btn:hover { background: var(--surface-2); }
  .renumber-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .quiz-switcher-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .quiz-switcher-spacer { flex: 1 1 auto; }
  .quiz-select {
    font: 600 .85rem/1 var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    max-width: 240px;
  }
  .quiz-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .quiz-tool-btn {
    font: 600 .78rem/1 var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .quiz-tool-btn:hover { background: var(--surface-2); }
  .quiz-tool-btn:disabled { opacity: .5; cursor: default; }
  .quiz-tool-btn-danger { color: var(--bad); }
  .quiz-tool-btn-danger:hover { background: var(--bad-soft); }
  .quiz-delete-confirm {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 500 .82rem/1.2 var(--font-body);
    color: var(--bad);
  }
  .lock-btn {
    font: 600 .78rem/1 var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .lock-btn:hover { background: var(--surface-2); }
  .lock-btn.locked { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); font-weight: 700; }
  .lock-banner {
    font: 600 .78rem/1.2 var(--font-body);
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  /* A locked quiz keeps every cell readable and copyable (readonly, not
     disabled) — only the interactive double-click-to-ask cells and the
     drag handle visibly go inert, since those are the ones that would
     otherwise silently spend an API call or reorder rows against a quiz
     that's supposed to be frozen. */
  .quiz-table-locked .guess-cell, .quiz-table-locked .numberish-cell { cursor: default; opacity: .7; }
  .quiz-table-locked .guess-cell:hover, .quiz-table-locked .numberish-cell:hover { background: none; }
  .quiz-table-locked .drag-cell { cursor: default; opacity: .4; }

  footer.note {
    font-size: .78rem;
    color: var(--muted);
    max-width: 62ch;
  }

  .prompt-review { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .prompt-review-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .prompt-review-title {
    font-family: var(--font-display);
    font-size: 1.02rem;
    font-weight: 600;
    margin: 0;
  }
  .copy-btn {
    font: 600 .68rem/1 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--accent-ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .copy-btn:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .copy-status {
    font: 500 .72rem/1 var(--font-body);
    color: var(--muted);
    font-style: italic;
  }
  .copy-status[data-ok="false"] { color: var(--bad); font-style: normal; }
  .prompt-review-hint {
    font-size: .78rem;
    color: var(--muted);
    max-width: 62ch;
    margin: 0;
  }
  .prompt-review-hint code {
    font-family: var(--font-mono);
    font-size: .92em;
    background: var(--surface-2);
    padding: 1px 4px;
    border-radius: 4px;
  }
  .prompt-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .prompt-box-label {
    font: 600 .72rem/1.2 var(--font-body);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .prompt-box-label .copy-btn, .prompt-box-label .copy-status { text-transform: none; letter-spacing: normal; }
  .prompt-box-body {
    margin: 0;
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: .8rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
  }

  .export-box {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: .78rem;
    line-height: 1.5;
    padding: 12px 14px;
    resize: vertical;
  }
  .export-box:focus-visible { outline: none; border-color: var(--accent); }
  /* The raw JSON dump is for backup/restore, not for reading — a smaller,
     denser font fits far more of it on screen without pretty-printing's
     indentation making that worse. */
  .export-box-compact { font-size: .68rem; line-height: 1.4; }

  .import-summary {
    font: 500 .82rem/1.3 var(--font-body);
    color: var(--good);
  }
  .import-summary[data-ok="false"] { color: var(--bad); }
  .import-log {
    margin: 0;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: .76rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
  }

  .is-stale { color: var(--muted); font-style: italic; }

  @media (max-width: 640px) {
    table.quiz-table, .quiz-table thead, .quiz-table tbody, .quiz-table tr, .quiz-table th, .quiz-table td {
      display: block;
      width: 100% !important;
    }
    .quiz-table thead { display: none; }
    .quiz-table tbody tr {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-block: 12px;
      overflow: hidden;
    }
    .quiz-table tbody tr:first-child { margin-top: 0; }
    .quiz-table td { border-bottom: 1px solid var(--border); }
    .quiz-table td:last-child { border-bottom: none; }
    .quiz-table td::before {
      content: attr(data-label);
      display: block;
      font: 600 .68rem/1.2 var(--font-body);
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 4px;
    }

<script id="app-script">
(function () {
  "use strict";

  var ANSWER_PROMPT_TEMPLATE =
    "You are answering a trivia question the way a fast, not-especially-careful player would — a literal, first-instinct read, not a careful expert analysis.\n\n" +
    "Question: {{question}}\n\n" +
    "Reply with only your best short answer, one line, no explanation and no hedging.";

  var NUMBERS_PROMPT_TEMPLATE =
    "A trivia question sometimes hides a second, numeric puzzle: adding together every number-like element in its text.\n\n" +
    "List every text span in the question below that a reasonable person might read as a number, in the order it appears.\n\n" +
    "Question: {{question}}\n\n" +
    "Rules:\n" +
    "- A span written in digits (\"300\", \"1990\") is kind \"numeral\".\n" +
    "- A span that reads as a number in words counts too: spelled-out numbers (\"one\", \"twenty-three\"), ordinals (\"third\"), and magnitude phrases (\"300 million\", \"a dozen\", \"千\", \"douzaine\") — kind \"wordish\". Give a magnitude phrase as one item with its full numeric value (\"300 million\" is one item worth 300000000), not split into pieces.\n" +
    "- Do not include the indefinite article \"a\"/\"an\" on its own, and do not include Roman numerals (\"IV\", \"LIV\").\n" +
    "- If nothing in the question reads as a number, return an empty array.\n\n" +
    "Reply with only a JSON array of objects {\"text\": string, \"value\": number, \"kind\": \"numeral\" | \"wordish\"}, no other text.";

  var HINT_NUMBERS_PROMPT_TEMPLATE =
    "A puzzle hint can hide a numeric puzzle of its own: adding together every number-like element in its text.\n\n" +
    "List every text span in the hint below that a reasonable person might read as a number, in the order it appears.\n\n" +
    "Hint: {{hint}}\n\n" +
    "Rules:\n" +
    "- A span written in digits (\"300\", \"1990\") is kind \"numeral\".\n" +
    "- A span that reads as a number in words counts too: spelled-out numbers (\"one\", \"twenty-three\"), ordinals (\"third\"), and magnitude phrases (\"300 million\", \"a dozen\", \"千\", \"douzaine\") — kind \"wordish\". Give a magnitude phrase as one item with its full numeric value (\"300 million\" is one item worth 300000000), not split into pieces.\n" +
    "- Do not include the indefinite article \"a\"/\"an\" on its own, and do not include Roman numerals (\"IV\", \"LIV\").\n" +
    "- If nothing in the hint reads as a number, return an empty array.\n\n" +
    "Reply with only a JSON array of objects {\"text\": string, \"value\": number, \"kind\": \"numeral\" | \"wordish\"}, no other text.";

  // One combined request covering every question and hint at once, for
  // "Recalculate all ishes" — each individual ask below pays for the same
  // rules/instructions text over and over, which can dwarf the question or
  // hint itself; folding everything into a single request pays that
  // overhead once instead of once per text.
  var BULK_NUMBERS_PROMPT_TEMPLATE =
    "Below are several trivia questions and hints, each tagged with a [key]. Some hide a second, numeric puzzle: adding together every number-like element in their text.\n\n" +
    "For each one, list every text span in it that a reasonable person might read as a number, in the order it appears.\n\n" +
    "{{items}}\n\n" +

    "- A span that reads as a number in words counts too: spelled-out numbers (\"one\", \"twenty-three\"), ordinals (\"third\"), and magnitude phrases (\"300 million\", \"a dozen\", \"千\", \"douzaine\") — kind \"wordish\". Give a magnitude phrase as one item with its full numeric value (\"300 million\" is one item worth 300000000), not split into pieces.\n" +
    "- Do not include the indefinite article \"a\"/\"an\" on its own, and do not include Roman numerals (\"IV\", \"LIV\").\n" +
    "- If nothing in an item's text reads as a number, give it an empty array.\n\n" +
    "Reply with only a JSON array with one entry per item above, in the same order, each shaped {\"key\": string (copied exactly from its [key] tag), \"items\": [{\"text\": string, \"value\": number, \"kind\": \"numeral\" | \"wordish\"}]}. No other text.";

  function buildBulkNumbersPrompt(items) {
    var listing = items.map(function (it) { return "[" + it.key + "] " + it.text; }).join("\n\n");
    return BULK_NUMBERS_PROMPT_TEMPLATE.replace("{{items}}", listing);
  }

  // ---------- data schema (Zod) ----------
  // One source of truth for what a row/quiz/state must look like. Used to
  // validate whatever gets loaded from localStorage or the baked-in seed
  // (below), and reused as-is by the quiz-import feature to scrub and
  // validate a pasted-in quiz before it's merged. z.object() strips any key
  // it doesn't recognize by default — that's what "scrub excess fields"
  // relies on — and every field below is optional-with-a-default so a
  // partial or older-shaped object still parses instead of failing outright.
  var z = ZodNS.z;

  var NumberishItemSchema = z.object({
    text: z.string(),
    value: z.number(),
    kind: z.enum(["numeral", "wordish"])
  });

  var NumberishDoneSchema = z.object({
    status: z.literal("done"),
    items: z.array(NumberishItemSchema).optional().default([]),
    modelTierApplied: z.string().optional(),
    approxTokens: z.number().optional(),
    updatedAt: z.number().optional(),
    stale: z.boolean().optional()
  });

  var NumberishErrorSchema = z.object({
    status: z.literal("error"),
    message: z.string().optional(),
    updatedAt: z.number().optional()
  });

  // A numberish field (row.numbers / row.hintNumbers) is null until asked
  // for, then either a "done" result or an "error" result.
  var NumberishSchema = z.union([NumberishDoneSchema, NumberishErrorSchema]).nullable();

  var GuessDoneSchema = z.object({
    status: z.literal("done"),
    text: z.string(),
    modelTierApplied: z.string().optional(),
    truncated: z.boolean().optional(),
    approxTokens: z.number().optional(),
    updatedAt: z.number().optional()
  });

  var GuessErrorSchema = z.object({
    status: z.literal("error"),
    message: z.string().optional(),
    updatedAt: z.number().optional()
  });

  // row.ai: null until asked for, then a "done" or "error" result.
  var GuessSchema = z.union([GuessDoneSchema, GuessErrorSchema]).nullable();

  var BulkIshesLastSchema = z.object({
    approxTokens: z.number().optional(),
    items: z.number().optional(),
    updatedAt: z.number().optional()
  }).nullable();

  var RowSchema = z.object({
    // Optional with a generated fallback (rather than required) so a
    // hand-trimmed import — just {short_answer, question, ...}, no id — still
    // validates; the merge logic below never trusts this generated id for an
    // existing row anyway (it keeps the row's real id), and always mints a
    // fresh one for a genuinely new row.
    id: z.string().optional().default(function () { return uid(); }),
    qnum: z.string().optional().default(""),
    question: z.string().optional().default(""),
    short_answer: z.string().optional().default(""),
    hint: z.string().optional().default(""),
    chains_to: z.string().nullable().optional().default(null),
    ai: GuessSchema.optional().default(null),
    numbers: NumberishSchema.optional().default(null),
    hintNumbers: NumberishSchema.optional().default(null),
    altText: z.string().optional().default(""),
    notes: z.string().optional().default(""),
    fullAnswer: z.string().optional().default("")
  });

  // A separate, more permissive schema used only to validate an imported
  // row (see the import feature below). RowSchema above describes what the
  // app's OWN stored rows always look like, where a text field is never
  // null — but in an import, an explicit `null` on any field is a
  // meaningful "reset this field" instruction, not a type error, so every
  // field here is nullable and nothing is required.
  var ImportRowSchema = z.object({
    id: z.string().optional(),
    qnum: z.string().nullable().optional(),
    question: z.string().nullable().optional(),
    short_answer: z.string().nullable().optional(),
    hint: z.string().nullable().optional(),
    chains_to: z.string().nullable().optional(),
    ai: GuessSchema.optional(),
    numbers: NumberishSchema.optional(),
    hintNumbers: NumberishSchema.optional(),
    altText: z.string().nullable().optional(),
    notes: z.string().nullable().optional(),
    fullAnswer: z.string().nullable().optional()
  });

  var QuizSchema = z.object({
    id: z.string(),
    title: z.string().optional().default(""),
    rows: z.array(RowSchema).optional().default([]),
    lastSortKey: z.string().nullable().optional().default(null),
    bulkIshesLast: BulkIshesLastSchema.optional().default(null),
    locked: z.boolean().optional().default(false)
  });

  var StateSchema = z.object({
    quizzes: z.array(QuizSchema).min(1),
    activeQuizId: z.string()
  });

  // Logs a failed safeParse's issues clearly, one line per issue, with the
  // field path and what was wrong with it. Shared by load-time validation
  // below and by the quiz-import validation.
  // One line per issue: "field.path: message [code]" (or "(root)" when the
  // issue isn't about any particular field) — shared by load-time logging
  // and by the on-screen + console import log.
  function formatZodIssues(result) {
    if (result.success) return [];
    return result.error.issues.map(function (issue) {
      var path = issue.path && issue.path.length ? issue.path.join(".") : "(root)";
      return path + ": " + issue.message + " [" + issue.code + "]";
    });
  }

  function logZodIssues(label, result) {
    if (result.success) return;
    console.warn("[trivia-audit] " + label + ": " + result.error.issues.length + " validation issue(s)");
    _.forEach(formatZodIssues(result), function (line) {
      console.warn("[trivia-audit]   " + line);
    });
    return result;
  }

  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "row-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function newBlankRow() {
    return { id: uid(), qnum: "", question: "", short_answer: "", hint: "", chains_to: null, ai: null, numbers: null, hintNumbers: null, altText: "", notes: "", fullAnswer: "" };
  }

  function defaultRows() {
    var rows = [];
    for (var i = 0; i < 5; i++) rows.push(newBlankRow());
    return rows;
  }

  function defaultQuiz(title) {
    return { id: uid(), title: title || "", rows: defaultRows(), lastSortKey: null, bulkIshesLast: null, locked: false };
  }

  function defaultState() {
    var quiz = defaultQuiz("");
    return { quizzes: [quiz], activeQuizId: quiz.id };
  }

  // ---------- persistence: this browser's localStorage, not the shared page ----------
  // Each published artifact is its own origin, so this key is already scoped
  // to this one page — no per-quiz namespacing needed. First load in a given
  // browser seeds from whatever was baked in at publish time (window.__INITIAL_STATE__);
  // every edit after that stays local to this browser and survives a reload
  // or a full quit-and-restart, but never travels to another browser, device,
  // or anyone else who opens the link.

  var STORAGE_KEY = "trivia-audit-state";

  // A page published before multiple quizzes existed has an old-shape state
  // (or __INITIAL_STATE__) sitting around — {title, rows, lastSortKey,
  // bulkIshesLast} directly, no quizzes array — and that's real playtesting
  // data, not something to discard. Wrap it as this browser's one existing
  // quiz instead of losing it.
  function migrateToMultiQuiz(raw) {
    var quiz = {
      id: uid(),
      title: raw.title || "",
      rows: raw.rows,
      lastSortKey: raw.lastSortKey || null,
      bulkIshesLast: raw.bulkIshesLast || null,
      locked: false
    };
    return { quizzes: [quiz], activeQuizId: quiz.id };
  }

  // Accepts either shape (post-migration or freshly parsed) and returns a
  // valid multi-quiz state, or null if what came in is unusable — never
  // half-fixes a corrupt structure, since callers fall back to the seed
  // or defaultState() on null.
  function normalizeState(parsed) {
    if (!parsed || typeof parsed !== "object") return null;
    if (_.isArray(parsed.quizzes)) {
      if (!parsed.quizzes.length) return null;
      if (!_.find(parsed.quizzes, { id: parsed.activeQuizId })) {
        parsed.activeQuizId = parsed.quizzes[0].id;
      }
      _.forEach(parsed.quizzes, function (q) {
        if (typeof q.locked !== "boolean") { q.locked = false; }
        if (!_.isArray(q.rows)) { q.rows = []; }
      });
    } else if (_.isArray(parsed.rows)) {
      parsed = migrateToMultiQuiz(parsed);
    } else {
      return null;
    }

    // Re-check the hand-repaired shape against the real schema: this catches
    // anything the quick repairs above didn't anticipate (a field of the
    // wrong type, a stray key, an unrecognized status string), strips any
    // excess fields and fills in defaults for anything missing — logged
    // either way. If the data's too far off for Zod to make sense of, fall
    // back to the hand-repaired copy rather than lose real playtesting data
    // over a validation nuance.
    var result = StateSchema.safeParse(parsed);
    if (result.success) return result.data;
    logZodIssues("Loaded state didn't fully match the schema (using best-effort repair instead)", result);
    return parsed;
  }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var normalized = normalizeState(JSON.parse(raw));
        if (normalized) return normalized;
      }
    } catch (e) {
      // localStorage unavailable (private browsing, disabled, quota) or corrupt JSON — fall through to the seed.
    }
    return normalizeState(window.__INITIAL_STATE__) || defaultState();
  }

  var state = loadState();

  // The one quiz currently on screen. Always looked up fresh off state
  // (never cached) so that a quiz switch is immediately reflected wherever
  // this is called — it's cheap at the size a person keeps in one page.
  function activeQuiz() {
    return _.find(state.quizzes, { id: state.activeQuizId }) || state.quizzes[0];
  }

  function isLocked() {
    var quiz = activeQuiz();
    return !!(quiz && quiz.locked);
  }

  var sampleAPI = null;
  var dirty = false;
  var loading = {};
  var loadingBulkIshes = false;
  var recalcNotice = null; // transient — never persisted, cleared on the next attempt or on success

  function esc(str) {
    return _.escape(str == null ? "" : String(str));
  }

  function findRowById(id) {
    return id ? _.find(activeQuiz().rows, { id: id }) : null;
  }

  // ---------- sorting ----------
  // Clicking a header commits that order into activeQuiz().rows itself (so it
  // survives a reload/new tab exactly as left) rather than being a transient
  // view-only overlay. sortState is still kept, but only as this session's
  // memory of which column/direction is "active" (for the ▲/▼ arrow and to
  // know which way to toggle on a repeat click) — it is not persisted and
  // is not what makes the order stick. activeQuiz().lastSortKey IS persisted, but
  // purely as a label: it never drives re-sorting on load, it only bolds
  // the header it names as a reminder of how the current order came to be.

  var sortState = { key: null, dir: "asc" };

  var SORT_COLUMNS = {
    qnum: {
      label: "Q#",
      get: function (row) { var n = Number(row.qnum); return _.trim(row.qnum) && isFinite(n) ? n : null; }
    },
    short_answer: {
      label: "Short answer",
      get: function (row) { var v = _.trim(row.short_answer); return v ? v.toLowerCase() : null; }
    },
    chains_to: {
      label: "Chains to",
      get: function (row) { var t = findRowById(row.chains_to); var v = t ? _.trim(t.short_answer) : ""; return v ? v.toLowerCase() : null; }
    },
    q_plus_rank: {
      label: "Q + #",
      get: function (row) { return qPlusRankValue(row); }
    },
    q_full: {
      label: "Question Full Sum",
      get: function (row) { return doneSum(row.numbers, "all"); }
    },
    q_numeral: {
      label: "Question Numeral Sum",
      get: function (row) { return doneSum(row.numbers, "numerals"); }
    },
    bn_full: {
      label: "BUT NOT Full Sum",
      get: function (row) { var t = findRowById(row.chains_to); return doneSum(t && t.hintNumbers, "all"); }
    },
    bn_numeral: {
      label: "BUT NOT Numeral sum",
      get: function (row) { var t = findRowById(row.chains_to); return doneSum(t && t.hintNumbers, "numerals"); }
    },
    h_full: {
      label: "Hint Full Sum",
      get: function (row) { return doneSum(row.hintNumbers, "all"); }
    },
    h_numeral: {
      label: "Hint Numeral sum",
      get: function (row) { return doneSum(row.hintNumbers, "numerals"); }
    },
    qb_full: {
      label: "Q+B Full",
      get: function (row) { return qbFullSumValue(row); }
    },
    q_ishes: {
      label: "Question ishes",
      get: function (row) { return (row.numbers && row.numbers.status === "done") ? row.numbers.items.length : null; }
    },
    bn_ishes: {
      label: "BUT NOT ishes",
      get: function (row) { var t = findRowById(row.chains_to); var hn = t && t.hintNumbers; return (hn && hn.status === "done") ? hn.items.length : null; }
    },
    h_ishes: {
      label: "Hint Ishes",
      get: function (row) { return (row.hintNumbers && row.hintNumbers.status === "done") ? row.hintNumbers.items.length : null; }
    }
  };

  function doneSum(entry, which) {
    if (!entry || entry.status !== "done") return null;
    var totals = summarizeNumberish(entry.items);
    var raw = which === "numerals" ? totals.sumNumerals : totals.sumAll;
    // Every "sum" cell (including Q+B Full, which just adds two of these
    // together) rounds to a whole number — the individual ishes themselves
    // (e.g. "quarter" → 0.25) are left exactly as extracted.
    return Math.round(raw);
  }

  function computeSortedRows(rows, key, dir) {
    var col = SORT_COLUMNS[key];
    if (!col) return rows;
    var withVal = rows.map(function (row, idx) { return { row: row, idx: idx, val: col.get(row) }; });
    withVal.sort(function (a, b) {
      var aMissing = a.val === null || a.val === undefined;
      var bMissing = b.val === null || b.val === undefined;
      if (aMissing && bMissing) return a.idx - b.idx;
      if (aMissing) return 1;
      if (bMissing) return -1;
      var cmp = (typeof a.val === "string") ? a.val.localeCompare(b.val) : (a.val - b.val);
      if (cmp === 0) cmp = a.idx - b.idx;
      return dir === "asc" ? cmp : -cmp;
    });
    return withVal.map(function (w) { return w.row; });
  }

  function sortedRows(rows) {
    if (!sortState.key || !SORT_COLUMNS[sortState.key]) return rows;
    return computeSortedRows(rows, sortState.key, sortState.dir);
  }

  function onSortClick(key) {
    if (isLocked()) return;
    var col = SORT_COLUMNS[key];
    if (!col) return;
    if (sortState.key === key) {
      sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
    } else {
      sortState.key = key;
      sortState.dir = "asc";
    }
    activeQuiz().rows = computeSortedRows(activeQuiz().rows, sortState.key, sortState.dir);
    activeQuiz().lastSortKey = key;
    render();
    scheduleSave();
  }

  // ---------- chain order ----------
  // Not a per-row sort key like the columns above — it's a walk of the graph
  // formed by every row's chains_to link (row -> the row its hint precedes),
  // always rooted at whichever unvisited row has the lowest Q# — that's what
  // guarantees question 1 always leads, rather than waiting behind whatever
  // happens to chain into it. Ascending walks forward (next = what the
  // current row points to); descending walks the same graph backward (next
  // = whatever points to the current row instead). Either way, whenever
  // there's more than one row to choose from — a merge point in the
  // backward direction, or simply more than one untouched chain still
  // waiting — the lowest Q# among the options goes next; once a path runs
  // out (nothing left to follow, or the only next step is already placed),
  // the walk restarts at the next lowest-Q# row still unvisited.
  function chainQnumOf(row) {
    var n = Number(row.qnum);
    return _.trim(row.qnum) && isFinite(n) ? n : null;
  }

  function pickLowestQnum(candidates) {
    var best = null, bestQ = null;
    _.forEach(candidates, function (row) {
      var q = chainQnumOf(row);
      if (best === null || (q !== null && (bestQ === null || q < bestQ))) {
        best = row;
        bestQ = q;
      }
    });
    return best;
  }

  function computeChainOrder(rows, direction) {
    var byId = {};
    _.forEach(rows, function (row) { byId[row.id] = row; });

    var predecessorsOf = {};
    _.forEach(rows, function (row) { predecessorsOf[row.id] = []; });
    _.forEach(rows, function (row) {
      if (row.chains_to && predecessorsOf[row.chains_to] !== undefined) {
        predecessorsOf[row.chains_to].push(row);
      }
    });

    function nextStepsOf(row) {
      if (direction === "backward") { return predecessorsOf[row.id]; }
      var target = row.chains_to && byId[row.chains_to];
      return target ? [target] : [];
    }

    var visited = {};
    var ordered = [];
    var remaining = rows.slice();

    while (remaining.length) {
      var candidates = remaining.filter(function (row) { return !visited[row.id]; });
      if (!candidates.length) break;
      var next = pickLowestQnum(candidates);
      // Follow one path as far as it goes — a straight line forward (each
      // row points to at most one other), or possibly branching backward
      // (more than one row can chain to the same target), in which case
      // the lowest-Q# branch is the one taken; whatever's left unpicked
      // stays unvisited and becomes its own restart point later.
      while (next && !visited[next.id]) {
        visited[next.id] = true;
        ordered.push(next);
        var steps = nextStepsOf(next).filter(function (row) { return !visited[row.id]; });
        next = steps.length ? pickLowestQnum(steps) : null;
      }
      remaining = remaining.filter(function (row) { return !visited[row.id]; });
    }
    return ordered;
  }

  function onChainOrderClick() {
    if (isLocked()) return;
    if (sortState.key === "chain_order") {
      sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
    } else {
      sortState.key = "chain_order";
      sortState.dir = "asc";
    }
    activeQuiz().rows = computeChainOrder(activeQuiz().rows, sortState.dir === "asc" ? "forward" : "backward");
    activeQuiz().lastSortKey = "chain_order";
    render();
    scheduleSave();
  }

  function sortArrow(key) {
    if (sortState.key !== key) return "";
    return '<span class="sort-arrow">' + (sortState.dir === "asc" ? "▲" : "▼") + "</span>";
  }

  function sortableTh(key, label, vertical, title, centered) {
    var cls = "sortable-th" + (vertical ? " vheader" : "") + (centered ? " sortable-th-centered" : "");
    if (activeQuiz().lastSortKey === key) { cls += " sortable-th-last"; }
    var titleAttr = title ? ' title="' + esc(title) + '"' : "";
    return '<th class="' + cls + '" data-sort-key="' + key + '"' + titleAttr + ">" + esc(label) + sortArrow(key) + "</th>";
  }

  function titleFor(s) {
    var t = _.trim(s.title);
    return t ? t + " — Trivia Ambiguity Audit" : "Trivia Ambiguity Audit";
  }

  // ---------- clue/hint auto-height ----------
  // The Question and Hint boxes grow with their own content, whichever of the
  // two needs more room setting the row's height, up to a generous shared cap
  // — past that cap they scroll internally instead of growing the row further.
  // The row's OTHER growing box (the shorter of the pair) is stretched to match,
  // so neither sits with dead space while the other is doing the work. The
  // ishes columns never drive this: they're capped at whatever height the row
  // already settled on and scroll internally if their own content needs more.
  // Alt Text/notes/Full Answer (.side-input) are a third case: they should
  // fill that same height for comfortable typing, but must never be read when
  // deciding what that height IS — so they're set to the same fixed height as
  // Question/Hint, just from the outside, after target is already decided.

  var CLUE_MAX_HEIGHT_PX = 480; // ~30 lines — generous, but not unbounded

  function syncRowClueHeight(tr) {
    var qEl = tr.querySelector(".q-cell > .q-input");
    var hintEl = tr.querySelector(".hint-cell > .hint-input");
    if (!qEl || !hintEl) return;

    qEl.style.height = "auto";
    hintEl.style.height = "auto";
    var qMin = parseFloat(getComputedStyle(qEl).minHeight) || 0;
    var hintMin = parseFloat(getComputedStyle(hintEl).minHeight) || 0;
    var qNatural = Math.max(qEl.scrollHeight, qMin);
    var hintNatural = Math.max(hintEl.scrollHeight, hintMin);
    var target = Math.min(Math.max(qNatural, hintNatural), CLUE_MAX_HEIGHT_PX);

    qEl.style.height = target + "px";
    hintEl.style.height = target + "px";

    // Sub-pixel line-height rounding can leave a box's scrollHeight a hair
    // taller than the clientHeight we just gave it, which would show a
    // spurious scrollbar sliver even though we're nowhere near the cap.
    // Nudge the target up (never past the cap) until that's gone.
    if (target < CLUE_MAX_HEIGHT_PX) {
      var slack = Math.max(qEl.scrollHeight - qEl.clientHeight, hintEl.scrollHeight - hintEl.clientHeight);
      if (slack > 0) {
        target = Math.min(target + slack, CLUE_MAX_HEIGHT_PX);
        qEl.style.height = target + "px";
        hintEl.style.height = target + "px";
      }
    }

    _.forEach(tr.querySelectorAll(".ish-scroll"), function (box) {
      box.style.maxHeight = target + "px";
    });

    _.forEach(tr.querySelectorAll(".side-input"), function (box) {
      box.style.height = target + "px";
    });
  }

  function syncClueHeights() {
    _.forEach(document.querySelectorAll(".quiz-table tbody tr"), syncRowClueHeight);
  }

  // ---------- render ----------

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = appHTML(state);
    document.title = titleFor(activeQuiz());
    wireEvents();
    syncClueHeights();
  }

  function appHTML(s) {
    var quiz = activeQuiz();
    var locked = !!quiz.locked;
    return (
      '<header class="topbar">' +
        quizSwitcherHTML(s, quiz) +
        '<div class="title-row">' +
          '<span class="eyebrow">Trivia round</span>' +
          '<input id="title-input" class="title-input" type="text" value="' + esc(quiz.title) + '" placeholder="Name this round…" aria-label="Quiz name"' + (locked ? " readonly" : "") + ">" +
        "</div>" +
        '<div class="topbar-meta">' +
          '<span class="hint">Paste a question and its short answer, then double-click the guess cell to ask a fast, none-too-careful model what it thinks the answer is — double-click again to refresh. Each ask spends your own Claude usage.</span>' +
          (locked ? '<span class="lock-banner">🔒 Locked — this quiz won’t accept edits until you unlock it.</span>' : "") +
          '<span id="save-status" class="save-status" data-state="idle"></span>' +
        "</div>" +
      "</header>" +
      '<div class="table-wrap">' +
        '<table class="quiz-table' + (quiz.lastSortKey === "qnum" ? " drag-enabled" : "") + (locked ? " quiz-table-locked" : "") + '">' +
          "<colgroup>" +
            "<col class=\"col-drag\">" +
            "<col class=\"col-q\"><col class=\"col-hint\"><col class=\"col-sa\"><col class=\"col-chain\">" +
            "<col class=\"col-butnot\">" +
            "<col class=\"col-qnum\">" +
            "<col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\"><col class=\"col-sum\">" +
            "<col class=\"col-side\"><col class=\"col-side\"><col class=\"col-side\">" +
            "<col class=\"col-ishes\"><col class=\"col-ishes\"><col class=\"col-ishes\">" +
            "<col class=\"col-ai\">" +
          "</colgroup>" +
          "<thead><tr>" +
            '<th class="drag-th" title="Drag to reorder — renumbers Q# to match"></th>' +
            "<th>Question</th>" +
            "<th>Hint</th>" +
            sortableTh("short_answer", "Short answer", false) +
            sortableTh("chains_to", "Chains to", false, "Which other row’s short answer this question’s hint precedes, once the chain is sorted out") +
            '<th title="The hint belonging to the question this one chains to">BUT NOT</th>' +
            sortableTh("qnum", "Q#", false) +
            sortableTh("q_plus_rank", "Q + #", true, "This question’s Full Sum plus its Q# rank — not the Q# value itself, but its 1-based position when every row is ranked by Q# (blank Q#s rank last, ties broken by short answer)") +
            sortableTh("q_full", "Question Full Sum", true, "Sum of every numberish span in the question, numerals included") +
            sortableTh("q_numeral", "Question Numeral Sum", true, "Sum of just the numeral spans in the question") +
            sortableTh("bn_full", "BUT NOT Full Sum", true, "Sum of every numberish span in the chained-to hint") +
            sortableTh("bn_numeral", "BUT NOT Numeral sum", true, "Sum of just the numeral spans in the chained-to hint") +
            sortableTh("h_full", "Hint Full Sum", true, "Sum of every numberish span in this row’s own hint") +
            sortableTh("h_numeral", "Hint Numeral sum", true, "Sum of just the numeral spans in this row’s own hint") +
            sortableTh("qb_full", "Q+B Full", true, "Question Full Sum + BUT NOT Full Sum — the combined “add up the numbers” total for this clue plus its chained hint") +
            "<th>Alt Text</th>" +
            "<th>notes</th>" +
            "<th>Full Answer</th>" +
            sortableTh("q_ishes", "Question ishes", false, "Every text span a reasonable person might read as a number, in the question", true) +
            sortableTh("bn_ishes", "BUT NOT ishes", false, "The same, for the chained-to hint (computed on that row’s own Hint Ishes cell)", true) +
            sortableTh("h_ishes", "Hint Ishes", false, "Every text span a reasonable person might read as a number, in this row’s own hint", true) +
            "<th>Quick-model guess</th>" +
          "</tr></thead>" +
          '<tbody id="rows-body">' + sortedRows(quiz.rows).map(function (row) { return rowHTML(row, locked); }).join("") + "</tbody>" +
        "</table>" +
      "</div>" +
      '<div class="toolbar-row">' +
        '<button id="add-row-btn" class="add-row-btn" type="button"' + (locked ? " disabled" : "") + '>+ Add row</button>' +
        '<button id="chain-order-btn" class="chain-order-btn' + (quiz.lastSortKey === "chain_order" ? " active" : "") + '" type="button"' + (locked ? " disabled" : "") + ' title="Question 1 always leads. ▲ then whatever it points to, then whatever that points to, and so on. ▼ then whatever points to it instead, and so on back. Ties broken by Q#. Click again to flip direction.">Sort by chain order' + sortArrow("chain_order") + "</button>" +
        '<button id="renumber-qnum-btn" class="renumber-btn" type="button"' + (locked ? " disabled" : "") + ' title="Replaces every Q# with its rank among all the current Q# values, tidying gaps and decimals into a clean 1, 2, 3… without moving any row — type a decimal like 3.1 to slot a row between 3 and 4, then renumber to clean it up">Renumber Q#</button>' +
        '<span class="toolbar-spacer"></span>' +
        '<button id="recalc-ishes-btn" class="recalc-ishes-btn" type="button"' + (loadingBulkIshes || locked ? " disabled" : "") + ' title="Sends every question and hint in one combined request, replacing whatever ishes are currently shown for each">' + (loadingBulkIshes ? "Recalculating…" : "↻ Recalculate all ishes") + "</button>" +
        (quiz.bulkIshesLast
          ? '<span class="tok-badge" title="Estimated from character count — the page can’t see exact token usage. Last run ' + esc(new Date(quiz.bulkIshesLast.updatedAt).toLocaleString()) + '">~' + fmtNum(quiz.bulkIshesLast.approxTokens) + " tok last time (" + quiz.bulkIshesLast.items + (quiz.bulkIshesLast.items === 1 ? " text" : " texts") + ")</span>"
          : "") +
        (recalcNotice ? '<span class="recalc-notice">' + esc(recalcNotice) + "</span>" : "") +
      "</div>" +
      '<footer class="note">Rows and answers are saved to this browser (not to the shared page) — they\'ll survive a reload or a full quit-and-restart here, but won\'t show up in a different browser, device, or for anyone else who opens this link. The quick-model guess is a lightweight gut check, not a ruling — read it as one way the question could land, not the last word. Q# is a free-typed number for your own ordering — sort by it or by any of the upright column headers by clicking them (click again to reverse); this reorders the rows for good, so it holds on reload or in a new tab — whichever header you sorted by last stays bold as a reminder, without re-sorting anything on its own. A decimal like 3.1 slots a row between 3 and 4 without renumbering anything else; Renumber Q# then tidies every row\'s Q# down to a clean 1, 2, 3… by rank, without moving a single row. Chains to, Hint, and BUT NOT are for chaining questions together — pick which row\'s short answer this one\'s hint precedes and type that hint in; double-click Hint Ishes on a row to have the model spot its number-like spans, and whichever row chains to it will show the same result under BUT NOT ishes. Q+B Full adds this question\'s Full Sum to that chained hint\'s Full Sum, for the widest reading of "add up the numbers". Q + # adds this question\'s own Full Sum to its Q# *rank* rather than the Q# itself (blank Q#s get no rank and show as "–"; ties are broken by short answer). Alt Text, notes, and Full Answer are plain notes columns of your own — they fill the row\'s full height like Question and Hint do, but typing into them never grows the row the way Question and Hint can. Editing a Question or Hint leaves its old totals in place, shown grayed and italic, until they\'re recomputed.</footer>' +
      '<section class="prompt-review">' +
        '<div class="prompt-review-head"><h2 class="prompt-review-title">Copy for Sheets</h2>' + copyBtnHTML("sheets-tsv-box") + "</div>" +
        '<p class="prompt-review-hint">Rows always go out in Q# rank order, regardless of the table’s current sort — one tab-separated line each: Q# rank, the question with its BUT NOT text folded in (line breaks become <code>&lt;br/&gt;</code>), Full Answer, Alt Text, notes, the Question Full Sum, and the question’s ishes tokens joined by “/”. Click the box to select it all, or use the Copy button, then paste straight into Google Sheets — it splits into columns on its own.</p>' +
        '<textarea class="export-box" id="sheets-tsv-box" readonly rows="10" spellcheck="false" aria-label="Tab-separated export for Google Sheets">' + esc(buildSheetsExportTSV(quiz.rows)) + "</textarea>" +
      "</section>" +
      '<section class="prompt-review">' +
        '<div class="prompt-review-head"><h2 class="prompt-review-title">Export</h2>' + copyBtnHTML("export-json-box") + "</div>" +
        '<p class="prompt-review-hint">A raw dump of every quiz stored on this page, active one included — copy it out to back up your progress, or paste part of it back in through Import.</p>' +
        '<textarea class="export-box export-box-compact" id="export-json-box" readonly rows="10" spellcheck="false" aria-label="Exported JSON">' + esc(JSON.stringify(s)) + "</textarea>" +
      "</section>" +
      '<section class="prompt-review">' +
        '<div class="prompt-review-head"><h2 class="prompt-review-title">Import</h2></div>' +
        '<p class="prompt-review-hint">Paste an exported state, a single quiz, or a bare list of rows here to merge it into <strong>' + esc(quiz.title || "this quiz") + '</strong>. Rows are matched to existing ones by short answer: a matched row keeps any field the paste leaves out, takes whatever the paste sets, and clears a field the paste explicitly sets to <code>null</code>. A short answer not already here is added as a new row. Runs Renumber Q# afterward and clears any chains_to that no longer resolves.</p>' +
        '<textarea class="export-box" id="import-box" rows="8" spellcheck="false" placeholder="Paste quiz JSON here…" aria-label="Quiz JSON to import"' + (locked ? " readonly" : "") + ">" + esc(importText) + "</textarea>" +
        '<div class="toolbar-row">' +
          '<button id="import-btn" class="add-row-btn" type="button"' + (locked ? " disabled" : "") + ">Import</button>" +
          (importResult ? '<span class="import-summary" data-ok="' + (importResult.ok ? "true" : "false") + '">' + esc(importResult.summary) + "</span>" : "") +
        "</div>" +
        (importResult && importResult.lines.length ? '<pre class="import-log">' + esc(importResult.lines.join("\n")) + "</pre>" : "") +
      "</section>" +
      '<section class="prompt-review">' +
        '<h2 class="prompt-review-title">Prompts used</h2>' +
        '<p class="prompt-review-hint">Read-only, for review — <code>{{question}}</code> / <code>{{hint}}</code> is where each row’s text gets spliced in.</p>' +
        '<div class="prompt-box">' +
          '<div class="prompt-box-label"><span>Quick-model guess</span>' + copyBtnHTML("prompt-answer-body") + "</div>" +
          '<pre class="prompt-box-body" id="prompt-answer-body">' + esc(ANSWER_PROMPT_TEMPLATE) + "</pre>" +
        "</div>" +
        '<div class="prompt-box">' +
          '<div class="prompt-box-label"><span>Numberishes extraction (question)</span>' + copyBtnHTML("prompt-numbers-q-body") + "</div>" +
          '<pre class="prompt-box-body" id="prompt-numbers-q-body">' + esc(NUMBERS_PROMPT_TEMPLATE) + "</pre>" +
        "</div>" +
        '<div class="prompt-box">' +
          '<div class="prompt-box-label"><span>Numberishes extraction (hint)</span>' + copyBtnHTML("prompt-numbers-hint-body") + "</div>" +
          '<pre class="prompt-box-body" id="prompt-numbers-hint-body">' + esc(HINT_NUMBERS_PROMPT_TEMPLATE) + "</pre>" +
        "</div>" +
        '<div class="prompt-box">' +
          '<div class="prompt-box-label"><span>Numberishes extraction (“Recalculate all ishes”)</span>' + copyBtnHTML("prompt-numbers-bulk-body") + "</div>" +
          '<pre class="prompt-box-body" id="prompt-numbers-bulk-body">' + esc(BULK_NUMBERS_PROMPT_TEMPLATE) + "</pre>" +
        "</div>" +
      "</section>"
    );
  }

  // A single button markup, reused for every read-only box (TSV/JSON
  // textareas and the four prompt <pre>s) — data-copy-for names the target
  // element's id, read at click time via .value (textarea) or .textContent
  // (pre), so the same delegated handler in wireEvents() covers all of them.
  function copyBtnHTML(targetId) {
    return '<button type="button" class="copy-btn" data-copy-for="' + targetId + '">Copy</button>' +
      '<span class="copy-status" data-copy-status-for="' + targetId + '"></span>';
  }

  // ---------- quiz switcher ----------
  // Every quiz gets its own {id, title, rows, lastSortKey, bulkIshesLast,
  // locked} record inside state.quizzes; state.activeQuizId picks which one
  // this page is currently showing. pendingDeleteQuizId is the one piece of
  // switcher UI state that's transient (never persisted) — it just tracks
  // whether the Delete button is mid-confirmation, the same way recalcNotice
  // tracks a one-off message elsewhere on the page. A plain window.confirm()
  // isn't reliable here (a published artifact runs in a sandboxed iframe,
  // where that call can be silently refused), so deleting asks inline instead.
  var pendingDeleteQuizId = null;

  function quizSwitcherHTML(s, quiz) {
    var options = s.quizzes.map(function (q) {
      var label = _.trim(q.title) || "Untitled quiz";
      if (q.locked) label += " 🔒";
      return '<option value="' + q.id + '"' + (q.id === s.activeQuizId ? " selected" : "") + ">" + esc(label) + "</option>";
    }).join("");

    var deleteControl;
    if (pendingDeleteQuizId === quiz.id) {
      deleteControl =
        '<span class="quiz-delete-confirm">Delete “' + esc(_.trim(quiz.title) || "Untitled quiz") + '”?' +
          '<button type="button" id="confirm-delete-quiz-btn" class="quiz-tool-btn quiz-tool-btn-danger">Yes, delete</button>' +
          '<button type="button" id="cancel-delete-quiz-btn" class="quiz-tool-btn">Cancel</button>' +
        "</span>";
    } else {
      deleteControl = '<button type="button" id="delete-quiz-btn" class="quiz-tool-btn quiz-tool-btn-danger"' + (s.quizzes.length <= 1 ? " disabled" : "") + ' title="Remove this quiz — the last remaining quiz can’t be deleted">Delete quiz</button>';
    }

    return (
      '<div class="quiz-switcher-row">' +
        '<select id="quiz-select" class="quiz-select" aria-label="Switch quiz">' + options + "</select>" +
        '<button type="button" id="new-quiz-btn" class="quiz-tool-btn">+ New quiz</button>' +
        deleteControl +
        '<span class="quiz-switcher-spacer"></span>' +
        '<button type="button" id="lock-quiz-btn" class="lock-btn' + (quiz.locked ? " locked" : "") + '">' + (quiz.locked ? "🔒 Locked" : "🔓 Lock this quiz") + "</button>" +
      "</div>"
    );
  }

  // New quiz, lock/unlock, and switching are all allowed even on a locked
  // quiz (locking only blocks edits to that quiz's own content) — only
  // deleting needs the inline Yes/Cancel confirmation, since it's the one
  // destructive action here.
  function wireQuizSwitcher() {
    var select = document.getElementById("quiz-select");
    if (select) {
      select.addEventListener("change", function (e) {
        state.activeQuizId = e.target.value;
        pendingDeleteQuizId = null;
        sortState = { key: null, dir: "asc" };
        render();
        scheduleSave();
      });
    }

    var newBtn = document.getElementById("new-quiz-btn");
    if (newBtn) {
      newBtn.addEventListener("click", function () {
        var quiz = defaultQuiz("");
        state.quizzes.push(quiz);
        state.activeQuizId = quiz.id;
        pendingDeleteQuizId = null;
        sortState = { key: null, dir: "asc" };
        render();
        scheduleSave();
      });
    }

    var deleteBtn = document.getElementById("delete-quiz-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function () {
        if (state.quizzes.length <= 1) return;
        pendingDeleteQuizId = state.activeQuizId;
        render();
      });
    }

    var confirmDeleteBtn = document.getElementById("confirm-delete-quiz-btn");
    if (confirmDeleteBtn) {
      confirmDeleteBtn.addEventListener("click", function () {
        var idx = _.findIndex(state.quizzes, { id: pendingDeleteQuizId });
        if (idx === -1 || state.quizzes.length <= 1) { pendingDeleteQuizId = null; render(); return; }
        state.quizzes.splice(idx, 1);
        if (state.activeQuizId === pendingDeleteQuizId) {
          state.activeQuizId = state.quizzes[Math.max(0, idx - 1)].id;
        }
        pendingDeleteQuizId = null;
        sortState = { key: null, dir: "asc" };
        render();
        scheduleSave();
      });
    }

    var cancelDeleteBtn = document.getElementById("cancel-delete-quiz-btn");
    if (cancelDeleteBtn) {
      cancelDeleteBtn.addEventListener("click", function () {
        pendingDeleteQuizId = null;
        render();
      });
    }

    var lockBtn = document.getElementById("lock-quiz-btn");
    if (lockBtn) {
      lockBtn.addEventListener("click", function () {
        activeQuiz().locked = !activeQuiz().locked;
        render();
        scheduleSave();
      });
    }
  }

  function rowHTML(row, locked) {
    var target = findRowById(row.chains_to);
    var bnLoadKey = target ? ("hn:" + target.id) : null;
    var ro = locked ? " readonly" : "";
    var dis = locked ? " disabled" : "";
    return (
      '<tr data-row-id="' + row.id + '">' +
        '<td class="drag-cell" draggable="' + (locked ? "false" : "true") + '" title="' + (locked ? "Locked — unlock this quiz to reorder" : "Drag to reorder") + '">⋮⋮</td>' +
        '<td data-label="Question" class="q-cell">' +
          '<textarea class="q-input" rows="6" data-field="question" data-row-id="' + row.id + '" placeholder="Paste the trivia question…"' + ro + ">" + esc(row.question) + "</textarea>" +
        "</td>" +
        '<td data-label="Hint" class="hint-cell">' +
          '<textarea class="q-input hint-input" rows="6" data-field="hint" data-row-id="' + row.id + '" placeholder="This question’s second-half hint…"' + ro + ">" + esc(row.hint) + "</textarea>" +
        "</td>" +
        '<td data-label="Short answer" class="sa-cell">' +
          '<input type="text" class="sa-input" data-field="short_answer" data-row-id="' + row.id + '" placeholder="Answer…" value="' + esc(row.short_answer) + '"' + ro + ">" +
        "</td>" +
        '<td data-label="Chains to" class="chain-cell">' + chainSelectHTML(row, locked) + "</td>" +
        '<td data-label="BUT NOT" class="butnot-cell" title="' + esc(target ? target.hint : "") + '">' + butNotInner(row, target) + "</td>" +
        '<td data-label="Q#" class="qnum-cell">' +
          '<input type="number" class="qnum-input" data-field="qnum" data-row-id="' + row.id + '" placeholder="#" value="' + esc(row.qnum) + '"' + ro + ">" +
        "</td>" +
        '<td data-label="Q + #" class="sum-cell">' + qPlusRankInner(row) + "</td>" +
        '<td data-label="Question Full Sum" class="sum-cell full-sum-cell" data-kind="question" data-row-id="' + row.id + '">' + numberishSumInner(row.numbers, "all") + "</td>" +
        '<td data-label="Question Numeral Sum" class="sum-cell">' + numberishSumInner(row.numbers, "numerals") + "</td>" +
        '<td data-label="BUT NOT Full Sum" class="sum-cell' + (target ? " full-sum-cell" : "") + '"' + (target ? ' data-kind="hint" data-row-id="' + target.id + '"' : "") + '>' + numberishSumInner(target && target.hintNumbers, "all") + "</td>" +
        '<td data-label="BUT NOT Numeral sum" class="sum-cell">' + numberishSumInner(target && target.hintNumbers, "numerals") + "</td>" +
        '<td data-label="Hint Full Sum" class="sum-cell full-sum-cell" data-kind="hint" data-row-id="' + row.id + '">' + numberishSumInner(row.hintNumbers, "all") + "</td>" +
        '<td data-label="Hint Numeral sum" class="sum-cell">' + numberishSumInner(row.hintNumbers, "numerals") + "</td>" +
        '<td data-label="Q+B Full" class="sum-cell">' + qbFullSumInner(row) + "</td>" +
        '<td data-label="Alt Text" class="side-cell">' +
          '<textarea class="q-input side-input" rows="6" data-field="altText" data-row-id="' + row.id + '" placeholder="Alt text…"' + ro + ">" + esc(row.altText) + "</textarea>" +
        "</td>" +
        '<td data-label="notes" class="side-cell">' +
          '<textarea class="q-input side-input" rows="6" data-field="notes" data-row-id="' + row.id + '" placeholder="Notes…"' + ro + ">" + esc(row.notes) + "</textarea>" +
        "</td>" +
        '<td data-label="Full Answer" class="side-cell">' +
          '<textarea class="q-input side-input" rows="6" data-field="fullAnswer" data-row-id="' + row.id + '" placeholder="Full answer…"' + ro + ">" + esc(row.fullAnswer) + "</textarea>" +
        "</td>" +
        '<td data-label="Question ishes" class="numberish-cell" data-kind="question" data-row-id="' + row.id + '" tabindex="0" role="button" aria-label="Double-click to find every number-like span in the question">' +
          '<div class="ish-scroll">' + numberishCellInner(row.numbers, "question", row.id) + "</div>" +
        "</td>" +
        '<td data-label="BUT NOT ishes" class="numberish-cell-static">' +
          '<div class="ish-scroll">' + (target ? numberishReadOnlyInner(target.hintNumbers, bnLoadKey) : '<div class="guess-body guess-empty">Pick a chain target</div>') + "</div>" +
        "</td>" +
        '<td data-label="Hint Ishes" class="numberish-cell" data-kind="hint" data-row-id="' + row.id + '" tabindex="0" role="button" aria-label="Double-click to find every number-like span in this row’s hint">' +
          '<div class="ish-scroll">' + numberishCellInner(row.hintNumbers, "hint", row.id) + "</div>" +
        "</td>" +
        '<td data-label="Quick-model guess" class="guess-cell" data-row-id="' + row.id + '" tabindex="0" role="button" aria-label="Double-click to ask the quick model">' +
          guessInner(row) +
        "</td>" +
      "</tr>"
    );
  }

  function chainSelectHTML(row, locked) {
    var options = ['<option value="">— pick —</option>'];
    _.forEach(activeQuiz().rows, function (other) {
      if (other.id === row.id) return;
      var label = _.trim(other.short_answer) || "(no short answer yet)";
      var selected = row.chains_to === other.id ? " selected" : "";
      options.push('<option value="' + other.id + '"' + selected + ">" + esc(label) + "</option>");
    });
    return '<select class="chain-select" data-row-id="' + row.id + '" aria-label="Chains to"' + (locked ? " disabled" : "") + ">" + options.join("") + "</select>";
  }

  function butNotInner(row, target) {
    if (!row.chains_to) {
      return '<span class="butnot-placeholder">Pick a chain target</span>';
    }
    if (!target) {
      return '<span class="butnot-placeholder">Target row not found</span>';
    }
    if (!_.trim(target.hint)) {
      return '<span class="butnot-placeholder">No hint entered yet</span>';
    }
    return esc(snippetize(target.hint, 50));
  }

  // A search-result-style snippet: cut to a word boundary near maxLen and
  // mark the truncation, rather than wrapping or overflowing the cell. The
  // full text is still on the cell's title tooltip and, of course, in the
  // source row's own Hint box.
  function snippetize(str, maxLen) {
    var s = _.trim(str);
    if (s.length <= maxLen) return s;
    var cut = s.slice(0, maxLen);
    var lastSpace = cut.lastIndexOf(" ");
    if (lastSpace > maxLen * 0.4) cut = cut.slice(0, lastSpace);
    return cut + "...";
  }

  function guessInner(row) {
    var ai = row.ai;
    if (loading[row.id]) {
      return '<div class="guess-body guess-loading">Thinking…</div>';
    }
    if (!ai) {
      return '<div class="guess-body guess-empty">Double-click to ask</div>';
    }
    if (ai.status === "error") {
      return (
        '<div class="guess-body guess-error">' + esc(ai.message || "Could not get an answer.") + "</div>" +
        '<div class="guess-meta">Double-click to try again</div>'
      );
    }
    var tokBit = (typeof ai.approxTokens === "number")
      ? '<span class="tok-badge" title="Estimated from character count — the page can’t see exact token usage">~' + ai.approxTokens + " tok</span>"
      : "";
    return (
      '<div class="guess-body guess-done">' + esc(ai.text) + "</div>" +
      '<div class="guess-meta">' +
        "<span>" + esc(ai.modelTierApplied || "quick") + " model" + (ai.truncated ? " · cut short" : "") + "</span>" +
        tokBit +
        '<button type="button" class="refresh-btn" data-action="guess" data-row-id="' + row.id + '">Refresh</button>' +
      "</div>"
    );
  }

  function numberishCellInner(entry, kind, targetRowId) {
    var loadKey = (kind === "hint" ? "hn:" : "n:") + targetRowId;
    var action = kind === "hint" ? "hintNumbers" : "numbers";
    if (loading[loadKey]) {
      return '<div class="guess-body guess-loading">Thinking…</div>';
    }
    if (!entry) {
      return '<div class="guess-body guess-empty">Double-click to ask</div>';
    }
    if (entry.status === "error") {
      return (
        '<div class="guess-body guess-error">' + esc(entry.message || "Could not get an answer.") + "</div>" +
        '<div class="guess-meta">Double-click to try again</div>'
      );
    }
    var tokBit = (typeof entry.approxTokens === "number")
      ? '<span class="tok-badge" title="Estimated from character count — the page can’t see exact token usage">~' + entry.approxTokens + " tok</span>"
      : "";
    var staleCls = entry.stale ? " is-stale" : "";
    var listHTML = entry.items.length
      ? '<div class="numberish-list' + staleCls + '">' + entry.items.map(function (it) {
          return '<div class="numberish-item"><span class="txt">' + esc(it.text) + '</span><span class="val">' + fmtNum(it.value) + "</span></div>";
        }).join("") + "</div>"
      : '<div class="numberish-empty' + staleCls + '">None found</div>';
    return (
      listHTML +
      '<div class="guess-meta">' +
        "<span>" + esc(entry.modelTierApplied || "quick") + " model" + (entry.truncated ? " · cut short" : "") + (entry.stale ? " · stale" : "") + "</span>" +
        tokBit +
        '<button type="button" class="refresh-btn" data-action="' + action + '" data-row-id="' + targetRowId + '">Refresh</button>' +
      "</div>"
    );
  }

  function numberishSumInner(entry, which) {
    var value = doneSum(entry, which);
    if (value === null) return '<span class="sum-empty">–</span>';
    var cls = "sum-value" + (entry && entry.stale ? " is-stale" : "");
    return '<span class="' + cls + '">' + fmtNum(value) + "</span>";
  }

  function qbFullSumValue(row) {
    var qSum = doneSum(row.numbers, "all");
    if (qSum === null) return null;
    var target = findRowById(row.chains_to);
    var bSum = doneSum(target && target.hintNumbers, "all");
    if (bSum === null) return null;
    return qSum + bSum;
  }

  function qbFullSumInner(row) {
    var v = qbFullSumValue(row);
    if (v === null) return '<span class="sum-empty">–</span>';
    var target = findRowById(row.chains_to);
    var stale = (row.numbers && row.numbers.stale) || (target && target.hintNumbers && target.hintNumbers.stale);
    var cls = "sum-value" + (stale ? " is-stale" : "");
    return '<span class="' + cls + '">' + fmtNum(v) + "</span>";
  }

  // "Q + #" = the question's own Full Sum, plus the *rank* (not the raw
  // value) of its Q#. Ranking is over every row's Q#, ascending, missing
  // Q#s sorted last and given no rank at all; ties (rows sharing a Q#) are
  // broken by short answer (alphabetical). Recomputed fresh on every call —
  // fine at this dataset's size (a couple dozen rows) and much simpler than
  // caching it across renders.
  function computeQnumRanking(rows) {
    var withVal = rows.map(function (row, idx) {
      return { row: row, idx: idx, qnum: chainQnumOf(row), sa: _.trim(row.short_answer).toLowerCase() };
    });
    withVal.sort(function (a, b) {
      var aMissing = a.qnum === null, bMissing = b.qnum === null;
      if (aMissing && bMissing) return a.idx - b.idx;
      if (aMissing) return 1;
      if (bMissing) return -1;
      var cmp = a.qnum - b.qnum;
      if (cmp === 0) cmp = a.sa.localeCompare(b.sa);
      if (cmp === 0) cmp = a.idx - b.idx;
      return cmp;
    });
    return withVal.map(function (w, i) {
      return { row: w.row, rank: (w.qnum === null) ? null : (i + 1) };
    });
  }

  function computeQnumRanks(rows) {
    var ranks = {};
    computeQnumRanking(rows).forEach(function (w) {
      ranks[w.row.id] = w.rank;
    });
    return ranks;
  }

  function qPlusRankValue(row) {
    var qSum = doneSum(row.numbers, "all");
    if (qSum === null) return null;
    var ranks = computeQnumRanks(activeQuiz().rows);
    var rank = ranks[row.id];
    if (rank === null || rank === undefined) return null;
    return qSum + rank;
  }

  function qPlusRankInner(row) {
    var v = qPlusRankValue(row);
    if (v === null) return '<span class="sum-empty">–</span>';
    var cls = "sum-value" + ((row.numbers && row.numbers.stale) ? " is-stale" : "");
    return '<span class="' + cls + '">' + fmtNum(v) + "</span>";
  }

  // ---------- copy-out for Google Sheets ----------
  // A plain tab-separated block, one line per row, meant to be selected and
  // pasted straight into a spreadsheet (Sheets splits pasted text into columns
  // on its own wherever it sees a tab). A field's own newlines would otherwise
  // look like the start of a new row, and a stray tab would look like an
  // extra column, so both get folded into something visible instead of
  // silently corrupting the paste.
  //
  // Order and the first field are both independent of whatever the on-screen
  // table happens to be sorted/dragged into right now: rows always go out in
  // Q# rank order (same ranking as the "Q + #" column and "Renumber Q#"),
  // and that rank — not the raw, possibly-gappy or decimal Q# value — is
  // what's written as the question number.
  function tsvField(value, sep) {
    var s = (value === null || value === undefined) ? "" : String(value);
    s = s.replace(/\r\n|\r|\n/g, "<br/>");
    s = s.split(sep).join(" ");
    return s;
  }

  function buildSheetsExportTSV(rows, sep) {
    sep = sep || "\t";
    return computeQnumRanking(rows).map(function (w) {
      var row = w.row;
      var target = findRowById(row.chains_to);
      var qCombined = (row.question || "") + "<br/>  ... BUT NOT ....<br/>" + (target ? (target.hint || "") : "");
      var qFull = doneSum(row.numbers, "all");
      var ishTokens = (row.numbers && row.numbers.status === "done")
        ? row.numbers.items.map(function (it) { return it.text; }).join("/")
        : "";
      var fields = [
        w.rank === null ? "" : String(w.rank),
        qCombined,
        row.fullAnswer || "",
        row.altText || "",
        row.notes || "",
        qFull === null ? "" : String(qFull),
        ishTokens
      ];
      return fields.map(function (f) { return tsvField(f, sep); }).join(sep);
    }).join("\n");
  }

  function numberishReadOnlyInner(entry, loadKey) {
    if (loadKey && loading[loadKey]) {
      return '<div class="guess-body guess-loading">Thinking…</div>';
    }
    if (!entry) {
      return '<div class="guess-body guess-empty">Not computed yet — double-click that row’s Hint Ishes</div>';
    }
    if (entry.status === "error") {
      return '<div class="guess-body guess-error">' + esc(entry.message || "Could not get an answer.") + "</div>";
    }
    var staleCls = entry.stale ? " is-stale" : "";
    if (!entry.items.length) {
      return '<div class="numberish-empty' + staleCls + '">None found</div>';
    }
    return '<div class="numberish-list' + staleCls + '">' + entry.items.map(function (it) {
      return '<div class="numberish-item"><span class="txt">' + esc(it.text) + '</span><span class="val">' + fmtNum(it.value) + "</span></div>";
    }).join("") + "</div>";
  }

  function summarizeNumberish(items) {
    var sumNumerals = 0, sumAll = 0;
    _.forEach(items, function (it) {
      var v = Number(it.value);
      if (!isFinite(v)) return;
      sumAll += v;
      if (it.kind === "numeral") sumNumerals += v;
    });
    return { sumNumerals: sumNumerals, sumAll: sumAll };
  }

  function fmtNum(n) {
    var v = Number(n);
    if (!isFinite(v)) return "–";
    // A <wbr> after each comma gives the browser a place to wrap a long
    // number ("3,000,000") without ever breaking mid-digit-group — it's
    // invisible and adds no width unless a line actually needs to break
    // there, so a narrow fixed-width column never grows to fit it.
    return v.toLocaleString("en-US").replace(/,/g, ",<wbr>");
  }

  // ---------- persistence ----------

  function scheduleSave() {
    dirty = true;
    saveNow();
  }
