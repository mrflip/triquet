  function setSaveStatus(kind) {
    var el = document.getElementById("save-status");
    if (!el) return;
    el.dataset.state = kind;
    var copy = {
      idle: "",
      error: "Couldn’t save to this browser — storage may be full, disabled, or private-browsing"
    };
    el.textContent = copy[kind] || "";
  }

  function saveNow() {
    if (!dirty) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      dirty = false;
      setSaveStatus("idle");
    } catch (e) {
      setSaveStatus("error");
    }
  }

  // ---------- events ----------

  // ---------- copy to clipboard ----------
  // Three-tier fallback, because a sandboxed iframe (which is what an
  // Artifact page runs inside) can silently refuse either clipboard
  // mechanism: try the async Clipboard API first, fall back to the
  // legacy execCommand on a throwaway textarea, and if BOTH are refused,
  // fall back to just selecting the source box's own text so the person
  // can still press Ctrl/Cmd+C themselves rather than getting nothing.
  function copyToClipboard(text, sourceEl, statusEl) {
    function showStatus(ok, msg) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.dataset.ok = ok ? "true" : "false";
      window.clearTimeout(statusEl._copyTimer);
      statusEl._copyTimer = window.setTimeout(function () {
        statusEl.textContent = "";
        delete statusEl.dataset.ok;
      }, 2200);
    }

    function selectSource() {
      if (!sourceEl) return;
      if (typeof sourceEl.select === "function") {
        sourceEl.select();
      } else if (window.getSelection && document.createRange) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        var range = document.createRange();
        range.selectNodeContents(sourceEl);
        sel.addRange(range);
      }
    }

    function legacyCopy() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try {
        ok = document.execCommand && document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (ok) {
        showStatus(true, "Copied");
      } else {
        selectSource();
        showStatus(false, "Couldn’t copy automatically — selected it, press ⌘/Ctrl+C");
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showStatus(true, "Copied"); },
        function () { legacyCopy(); }
      );
    } else {
      legacyCopy();
    }
  }

  function onCopyBtnClick(btn) {
    var targetId = btn.dataset.copyFor;
    var target = document.getElementById(targetId);
    if (!target) return;
    var text = (typeof target.value === "string") ? target.value : target.textContent;
    var statusEl = document.querySelector('[data-copy-status-for="' + targetId + '"]');
    copyToClipboard(text, target, statusEl);
  }

  function wireEvents() {
    var titleInput = document.getElementById("title-input");
    titleInput.addEventListener("input", function (e) {
      if (isLocked()) return;
      activeQuiz().title = e.target.value;
    });
    titleInput.addEventListener("blur", function () {
      if (isLocked()) return;
      scheduleSave();
    });

    document.getElementById("add-row-btn").addEventListener("click", function () {
      if (isLocked()) return;
      activeQuiz().rows.push(newBlankRow());
      render();
      scheduleSave();
    });

    wireQuizSwitcher();

    document.getElementById("chain-order-btn").addEventListener("click", onChainOrderClick);

    document.getElementById("renumber-qnum-btn").addEventListener("click", onRenumberClick);

    document.getElementById("recalc-ishes-btn").addEventListener("click", onRecalcAllIshesClick);

    var tsvBox = document.getElementById("sheets-tsv-box");
    if (tsvBox) {
      tsvBox.addEventListener("click", function () { tsvBox.select(); });
      tsvBox.addEventListener("focus", function () { tsvBox.select(); });
    }

    var jsonBox = document.getElementById("export-json-box");
    if (jsonBox) {
      jsonBox.addEventListener("click", function () { jsonBox.select(); });
      jsonBox.addEventListener("focus", function () { jsonBox.select(); });
    }

    var importBox = document.getElementById("import-box");
    if (importBox) {
      importBox.addEventListener("input", function (e) { importText = e.target.value; });
    }
    var importBtn = document.getElementById("import-btn");
    if (importBtn) {
      importBtn.addEventListener("click", onImportClick);
    }

    _.forEach(document.querySelectorAll(".copy-btn"), function (btn) {
      btn.addEventListener("click", function () { onCopyBtnClick(btn); });
    });

    _.forEach(document.querySelectorAll(".q-input, .sa-input, .hint-input, .qnum-input"), function (input) {
      input.addEventListener("blur", onFieldBlur);
    });

    // Grow the clue/hint boxes live as you type, not just after the fact —
    // this doesn't touch saved state, so it never schedules a save on its own.
    _.forEach(document.querySelectorAll(".q-input, .hint-input"), function (box) {
      box.addEventListener("input", function () {
        var tr = box.closest("tr");
        if (tr) syncRowClueHeight(tr);
      });
    });

    _.forEach(document.querySelectorAll(".chain-select"), function (sel) {
      sel.addEventListener("change", onChainChange);
    });

    _.forEach(document.querySelectorAll(".sortable-th"), function (th) {
      th.addEventListener("click", function () { onSortClick(th.dataset.sortKey); });
    });

    _.forEach(document.querySelectorAll(".guess-cell"), function (cell) {
      cell.addEventListener("dblclick", function () { askGuess(cell.dataset.rowId); });
      cell.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); askGuess(cell.dataset.rowId); }
      });
    });

    _.forEach(document.querySelectorAll(".numberish-cell"), function (cell) {
      if (!cell.dataset.rowId) return; // disabled: no chain target yet
      var kind = cell.dataset.kind;
      var fire = function () { askNumberish(cell.dataset.rowId, kind); };
      cell.addEventListener("dblclick", fire);
      cell.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fire(); }
      });
    });

    // Easter egg: double-click any of the three "Full Sum" cells to recompute
    // the numberishes behind it — no visible affordance, just the dblclick.
    _.forEach(document.querySelectorAll(".full-sum-cell"), function (cell) {
      if (!cell.dataset.rowId) return;
      cell.addEventListener("dblclick", function () {
        askNumberish(cell.dataset.rowId, cell.dataset.kind);
      });
    });

    _.forEach(document.querySelectorAll(".refresh-btn"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var action = btn.dataset.action;
        if (action === "numbers") askNumberish(btn.dataset.rowId, "question");
        else if (action === "hintNumbers") askNumberish(btn.dataset.rowId, "hint");
        else askGuess(btn.dataset.rowId);
      });
    });

    wireDragReorder();
  }

  // ---------- drag-to-reorder (only shown while sorted by Q#) ----------

  var dragSrcRowId = null;

  function wireDragReorder() {
    _.forEach(document.querySelectorAll(".drag-cell"), function (handle) {
      var tr = handle.closest("tr");
      if (!tr) return;
      handle.addEventListener("dragstart", function (e) {
        dragSrcRowId = tr.dataset.rowId;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", tr.dataset.rowId); // Firefox needs this to allow the drag
        tr.classList.add("dragging");
      });
      handle.addEventListener("dragend", function () {
        tr.classList.remove("dragging");
        _.forEach(document.querySelectorAll(".quiz-table tbody tr.drag-over"), function (row) {
          row.classList.remove("drag-over");
        });
        dragSrcRowId = null;
      });
    });

    _.forEach(document.querySelectorAll(".quiz-table tbody tr"), function (tr) {
      tr.addEventListener("dragover", function (e) {
        if (!dragSrcRowId || dragSrcRowId === tr.dataset.rowId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        tr.classList.add("drag-over");
      });
      tr.addEventListener("dragleave", function () {
        tr.classList.remove("drag-over");
      });
      tr.addEventListener("drop", function (e) {
        if (!dragSrcRowId || dragSrcRowId === tr.dataset.rowId) return;
        e.preventDefault();
        onRowDrop(dragSrcRowId, tr.dataset.rowId);
      });
    });
  }

  function onRowDrop(srcId, targetId) {
    if (isLocked()) return;
    var srcIdx = _.findIndex(activeQuiz().rows, { id: srcId });
    if (srcIdx === -1) return;
    var srcRow = activeQuiz().rows[srcIdx];
    activeQuiz().rows.splice(srcIdx, 1);
    var targetIdx = _.findIndex(activeQuiz().rows, { id: targetId });
    if (targetIdx === -1) {
      activeQuiz().rows.push(srcRow);
    } else {
      activeQuiz().rows.splice(targetIdx, 0, srcRow);
    }
    renumberByPosition();
    render();
    scheduleSave();
  }

  // Every row gets a fresh, sequential Q# from its final position (top = 1) —
  // including any row that had no valid Q# before, which can land it well past
  // whatever the old max was. This only runs off an actual drag; a plain header
  // click still just sorts by whatever Q# values are already there.
  function renumberByPosition() {
    _.forEach(activeQuiz().rows, function (row, idx) {
      row.qnum = String(idx + 1);
    });
  }

  // The "Renumber Q#" button — deliberately NOT the same thing renumberByPosition()
  // does for a drag-drop. This one is about compressing whatever Q# VALUES are
  // currently sitting in the rows down to a clean 1..n sequence, without moving
  // a single row: each row keeps its position, and just trades its current Q#
  // for that value's rank among every row's Q# (ties broken by short answer,
  // same as the "Q + #" column's ranking) — so 4, 3.3, 6, 1 becomes 3, 2, 4, 1,
  // in place. That's the point: it lets "type 3.1 into this row's Q#" work as
  // "put this between whatever's 3 and 4 right now", and renumbering afterward
  // just tidies the numbers back to integers without disturbing that placement.
  // A row with no Q# yet is left alone (it has no rank to take). Because rows
  // never move here, this must NOT flip on Q#-sort/drag mode the way a real
  // reorder does — that would immediately re-sort the rows by their newly
  // cleaned-up values and undo the "no reordering" promise.
  function renumberByRank() {
    var ranks = computeQnumRanks(activeQuiz().rows);
    _.forEach(activeQuiz().rows, function (row) {
      var r = ranks[row.id];
      if (r !== null && r !== undefined) { row.qnum = String(r); }
    });
  }

  function onRenumberClick() {
    if (isLocked()) return;
    renumberByRank();
    render();
    scheduleSave();
  }

  // ---------- quiz import: paste JSON, deep-merge into the active quiz ----------
  // Both transient — never persisted — so a reload never leaves a stale
  // paste or a stale result sitting in the box.
  var importText = "";
  var importResult = null; // { ok: boolean, summary: string, lines: string[] }

  function shortAnswerKey(s) {
    var v = _.trim(s);
    return v ? v.toLowerCase() : null;
  }

  // What an explicit `null` on an imported field resets it to — matches
  // what "no value" means for that field everywhere else in the app: the
  // nullable ai/numbers/hintNumbers/chains_to fields reset to null, every
  // plain-text field resets to "".
  var ROW_RESET_VALUES = {
    qnum: "", question: "", short_answer: "", hint: "",
    chains_to: null, ai: null, numbers: null, hintNumbers: null,
    altText: "", notes: "", fullAnswer: ""
  };
  // chains_to is handled separately below (it needs remapping, not a
  // straight copy), so it's excluded from this generic merge list.
  var MERGE_FIELDS = ["qnum", "question", "short_answer", "hint", "ai", "numbers", "hintNumbers", "altText", "notes", "fullAnswer"];

  // Makes sense of whatever JSON got pasted in: a full multi-quiz export
  // (uses whichever of its quizzes matches this one by id, else by title,
  // else its first), a single quiz object, or a bare array of rows. Reads
  // the RAW parsed object rather than anything Zod has touched, because the
  // merge below needs to tell "field absent" from "field explicitly null"
  // apart, and Zod's own defaulting collapses that distinction.
  function pickRawRowsArray(parsed) {
    if (parsed && _.isArray(parsed.quizzes)) {
      var quiz = activeQuiz();
      var match = _.find(parsed.quizzes, function (q) { return q && q.id === quiz.id; }) ||
        _.find(parsed.quizzes, function (q) {
          var k = q && shortAnswerKey(q.title);
          return k && k === shortAnswerKey(quiz.title);
        }) ||
        parsed.quizzes[0];
      return {
        rows: (match && _.isArray(match.rows)) ? match.rows : [],
        sourceLabel: "an exported state (used its quiz " + JSON.stringify((match && match.title) || "") + ")"
      };
    }
    if (parsed && _.isArray(parsed.rows)) {
      return { rows: parsed.rows, sourceLabel: "a single quiz object" };
    }
    if (_.isArray(parsed)) {
      return { rows: parsed, sourceLabel: "a bare list of rows" };
    }
    return null;
  }

  function onImportClick() {
    if (isLocked()) return;

    var parsed;
    try {
      parsed = JSON.parse(importText);
    } catch (e) {
      importResult = { ok: false, summary: "Couldn’t parse that as JSON — " + e.message, lines: [] };
      console.warn("[trivia-audit] Import: JSON.parse failed — " + e.message);
      render();
      return;
    }

    var picked = pickRawRowsArray(parsed);
    if (!picked) {
      importResult = {
        ok: false,
        summary: "Didn’t recognize that shape — expected an exported state ({quizzes:[…]}), a single quiz ({rows:[…]}), or a bare array of rows.",
        lines: []
      };
      console.warn("[trivia-audit] Import: unrecognized top-level shape", parsed);
      render();
      return;
    }

    var quiz = activeQuiz();
    var lines = ["Reading the paste as " + picked.sourceLabel + " — " + picked.rows.length + " row(s)."];

    // foreign row id -> short_answer key, built from the raw import batch
    // itself, so a chains_to that points at another row *within the pasted
    // data* can be followed even though every new row gets a fresh id here.
    var importIdToKey = {};
    _.forEach(picked.rows, function (r) {
      if (r && r.id != null) importIdToKey[String(r.id)] = shortAnswerKey(r.short_answer);
    });

    var pendingChainRemaps = []; // { targetRow, foreignId }
    var mergedCount = 0, addedCount = 0, skippedCount = 0;

    _.forEach(picked.rows, function (rawRow, idx) {
      var label = "Row " + (idx + 1) + (rawRow && rawRow.short_answer ? " (“" + rawRow.short_answer + "”)" : " (no short answer)");
      // ImportRowSchema (not the stricter RowSchema) validates this: every
      // field nullable, nothing required — an explicit null is a legitimate
      // "reset this field" instruction here, not a type error.
      var result = ImportRowSchema.safeParse(rawRow);
      if (!result.success) {
        skippedCount++;
        lines.push(label + ": SKIPPED — failed validation:");
        _.forEach(formatZodIssues(result), function (l) { lines.push("    " + l); });
        console.warn("[trivia-audit] Import — " + label + " skipped, failed validation:", result.error.issues);
        return;
      }
      var decoded = result.data;
      var key = shortAnswerKey(rawRow && rawRow.short_answer);
      var target = key ? _.find(quiz.rows, function (r) { return shortAnswerKey(r.short_answer) === key; }) : null;
      var isNew = !target;
      if (isNew) target = newBlankRow();

      // Same field-by-field merge whether this landed on an existing row or
      // a fresh blank one: a field absent from the import leaves whatever
      // was already there (the blank default, for a new row) untouched; an
      // explicit null resets it; anything else takes the validated/scrubbed
      // import value.
      _.forEach(MERGE_FIELDS, function (field) {
        if (!_.has(rawRow, field)) return;
        target[field] = (rawRow[field] === null) ? ROW_RESET_VALUES[field] : decoded[field];
      });
      if (_.has(rawRow, "chains_to")) {
        if (rawRow.chains_to === null) { target.chains_to = null; }
        else { pendingChainRemaps.push({ targetRow: target, foreignId: String(rawRow.chains_to) }); }
      }

      if (isNew) {
        quiz.rows.push(target);
        addedCount++;
        lines.push(label + ": no existing row shares that short answer — added as new.");
      } else {
        mergedCount++;
        lines.push(label + ": merged into the existing matching row.");
      }
    });

    // Resolve chains_to for everything just touched, via the import
    // batch's own id -> short_answer map. Anything that doesn't resolve to
    // another row actually present in the merged quiz is left unset rather
    // than guessed at.
    _.forEach(pendingChainRemaps, function (entry) {
      var targetKey = importIdToKey[entry.foreignId];
      var resolved = targetKey ? _.find(quiz.rows, function (r) { return shortAnswerKey(r.short_answer) === targetKey; }) : null;
      if (resolved && resolved.id !== entry.targetRow.id) {
        entry.targetRow.chains_to = resolved.id;
      } else {
        entry.targetRow.chains_to = null;
        lines.push("Note: a chains_to in the import didn’t resolve to another row in this quiz — cleared.");
      }
    });

    // Independent safety sweep over the WHOLE quiz (not just what this
    // import touched): clear any chains_to pointing at a row that no
    // longer exists, or at itself.
    var idsPresent = {};
    _.forEach(quiz.rows, function (r) { idsPresent[r.id] = true; });
    var clearedDangling = 0;
    _.forEach(quiz.rows, function (r) {
      if (r.chains_to && (r.chains_to === r.id || !idsPresent[r.chains_to])) {
        r.chains_to = null;
        clearedDangling++;
      }
    });
    if (clearedDangling) lines.push("Cleared " + clearedDangling + " invalid/dangling chains_to link(s) found across the quiz.");

    renumberByRank();

    var summary = mergedCount + " merged, " + addedCount + " added" +
      (skippedCount ? ", " + skippedCount + " skipped — see log below" : "") +
      ". Renumbered Q# by rank.";
    importResult = { ok: skippedCount === 0, summary: summary, lines: lines };
    importText = "";
    console.info("[trivia-audit] Import complete — " + summary);

    render();
    scheduleSave();
  }

  function onChainChange(e) {
    if (isLocked()) return;
    var rowId = e.target.dataset.rowId;
    var row = _.find(activeQuiz().rows, { id: rowId });
    if (!row) return;
    row.chains_to = e.target.value || null;
    render();
    scheduleSave();
  }

  function onFieldBlur(e) {
    if (isLocked()) return;
    var rowId = e.target.dataset.rowId;
    var field = e.target.dataset.field;
    var row = _.find(activeQuiz().rows, { id: rowId });
    if (!row) return;
    var val = e.target.value;
    if (row[field] !== val) {
      // Editing the question or hint text leaves any prior numberish
      // extraction in place (still shown, still summed) but stale — the
      // model hasn't seen the new wording yet. Recomputing (double-click)
      // replaces the entry and clears the flag.
      if (field === "question" && row.numbers) { row.numbers.stale = true; }
      if (field === "hint" && row.hintNumbers) { row.hintNumbers.stale = true; }
      row[field] = val;
      // short_answer feeds every row's "Chains to" options, and hint feeds
      // whichever row's BUT NOT column points here — re-render so those
      // other cells pick up the change without waiting on an unrelated action.
      render();
      scheduleSave();
    }
  }

  function askGuess(rowId) {
    if (isLocked()) return;
    if (loading[rowId]) return;
    var row = _.find(activeQuiz().rows, { id: rowId });
    if (!row) return;
    if (!_.trim(row.question)) return;
    if (!sampleAPI) {
      row.ai = { status: "error", message: "Asking Claude isn’t available in this view.", updatedAt: Date.now() };
      render();
      return;
    }
    loading[rowId] = true;
    refreshCell(rowId, "guess-cell", guessInner(row));

    var prompt = ANSWER_PROMPT_TEMPLATE.replace("{{question}}", row.question);

    sampleAPI(prompt, { modelTier: "quick", cache: false }).then(
      function (result) {
        delete loading[rowId];
        row.ai = {
          status: "done",
          text: _.trim(result.text),
          modelTierApplied: result.modelTierApplied,
          truncated: result.truncated,
          approxTokens: estimateTokens(prompt) + estimateTokens(result.text),
          updatedAt: Date.now()
        };
        render();
        scheduleSave();
      },
      function (err) {
        delete loading[rowId];
        row.ai = { status: "error", message: errorCopy(err && err.code), updatedAt: Date.now() };
        render();
        scheduleSave();
      }
    );
  }

  // Numberish extraction (this function and the bulk recalc below) runs on
  // "default" rather than "quick" — catching every number-like span, including
  // easy-to-miss ones like a spelled-out foreign-language numeral, is worth the
  // extra cost over the quick-model guess, which only needs a fast first
  // instinct. Existing rows computed before this change keep showing "quick
  // model" until they're recomputed (individually or via Recalculate all
  // ishes) — nothing here retroactively touches already-stored results.
  function askNumberish(rowId, kind) {
    if (isLocked()) return;
    var loadKey = (kind === "hint" ? "hn:" : "n:") + rowId;
    if (loading[loadKey]) return;
    var row = _.find(activeQuiz().rows, { id: rowId });
    if (!row) return;
    var sourceText = kind === "hint" ? row.hint : row.question;
    if (!_.trim(sourceText)) return;
    var field = kind === "hint" ? "hintNumbers" : "numbers";
    if (!sampleAPI) {
      row[field] = { status: "error", message: "Asking Claude isn’t available in this view.", updatedAt: Date.now() };
      render();
      return;
    }
    loading[loadKey] = true;
    refreshCells("numberish-cell", kind === "hint" ? "hint" : "question", rowId, '<div class="ish-scroll">' + numberishCellInner(row[field], kind, rowId) + "</div>");

    var template = kind === "hint" ? HINT_NUMBERS_PROMPT_TEMPLATE : NUMBERS_PROMPT_TEMPLATE;
    var placeholder = kind === "hint" ? "{{hint}}" : "{{question}}";
    var prompt = template.replace(placeholder, sourceText);

    sampleAPI.json(prompt, { modelTier: "default", cache: false }).then(
      function (result) {
        delete loading[loadKey];
        var items = _.isArray(result) ? result : [];
        items = items
          .map(function (it) {
            return {
              text: String((it && it.text) || ""),
              value: Number(it && it.value),
              kind: (it && it.kind === "numeral") ? "numeral" : "wordish"
            };
          })
          .filter(function (it) { return it.text && isFinite(it.value); });
        row[field] = {
          status: "done",
          items: items,
          modelTierApplied: "default",
          approxTokens: estimateTokens(prompt) + estimateTokens(JSON.stringify(result)),
          updatedAt: Date.now()
        };
        render();
        scheduleSave();
      },
      function (err) {
        delete loading[loadKey];
        row[field] = { status: "error", message: errorCopy(err && err.code), updatedAt: Date.now() };
        render();
        scheduleSave();
      }
    );
  }

  // ---------- bulk ishes recompute ----------
  // One combined request for every question and hint that has text, instead
  // of one request per cell — the fixed rules/instructions text is the same
  // either way, so folding everything together pays for it once. The token
  // total shown afterward is for that one combined request as a whole, kept
  // separate from (and never clearing, or cleared by) each cell's own
  // "~N tok" figure from an individual ask.

  function collectBulkNumberishItems(rows) {
    var items = [];
    _.forEach(rows, function (row) {
      if (_.trim(row.question)) { items.push({ key: "q:" + row.id, rowId: row.id, field: "numbers", text: row.question }); }
      if (_.trim(row.hint)) { items.push({ key: "h:" + row.id, rowId: row.id, field: "hintNumbers", text: row.hint }); }
    });
    return items;
  }

  function onRecalcAllIshesClick() {
    if (isLocked()) return;
    if (loadingBulkIshes) return;
    recalcNotice = null;
    var items = collectBulkNumberishItems(activeQuiz().rows);
    if (!items.length) {
      recalcNotice = "No questions or hints have any text yet — nothing to recalculate.";
      render();
      return;
    }
    if (!sampleAPI) {
      recalcNotice = "Asking Claude isn’t available in this view.";
      render();
      return;
    }

    loadingBulkIshes = true;
    _.forEach(items, function (it) { loading[(it.field === "hintNumbers" ? "hn:" : "n:") + it.rowId] = true; });
    render();

    var prompt = buildBulkNumbersPrompt(items);

    sampleAPI.json(prompt, { modelTier: "default", cache: false }).then(
      function (result) {
        loadingBulkIshes = false;
        _.forEach(items, function (it) { delete loading[(it.field === "hintNumbers" ? "hn:" : "n:") + it.rowId]; });

        var byKey = {};
        _.forEach(_.isArray(result) ? result : [], function (entry) {
          if (entry && typeof entry.key === "string") { byKey[entry.key] = entry; }
        });

        _.forEach(items, function (it) {
          var row = _.find(activeQuiz().rows, { id: it.rowId });
          if (!row) return;
          var entry = byKey[it.key];
          if (!entry) {
            row[it.field] = { status: "error", message: "The combined response didn’t include this one — try refreshing it on its own.", updatedAt: Date.now() };
            return;
          }
          var cleaned = (_.isArray(entry.items) ? entry.items : [])
            .map(function (raw) {
              return {
                text: String((raw && raw.text) || ""),
                value: Number(raw && raw.value),
                kind: (raw && raw.kind === "numeral") ? "numeral" : "wordish"
              };
            })
            .filter(function (raw) { return raw.text && isFinite(raw.value); });
          // No per-row approxTokens here — the cost was shared across every
          // item in the one request, so attributing a slice of it to just
          // this row would be a made-up number. The real total is on the
          // request as a whole, in activeQuiz().bulkIshesLast below.
          row[it.field] = { status: "done", items: cleaned, modelTierApplied: "default", updatedAt: Date.now() };
        });

        activeQuiz().bulkIshesLast = {
          approxTokens: estimateTokens(prompt) + estimateTokens(JSON.stringify(result)),
          items: items.length,
          updatedAt: Date.now()
        };
        recalcNotice = null;

        render();
        scheduleSave();
      },
      function (err) {
        loadingBulkIshes = false;
        _.forEach(items, function (it) { delete loading[(it.field === "hintNumbers" ? "hn:" : "n:") + it.rowId]; });
        recalcNotice = "Couldn’t recalculate: " + errorCopy(err && err.code) + " Nothing was changed.";
        render();
      }
    );
  }

  function refreshCell(rowId, cellClass, html) {
    var cell = document.querySelector("." + cellClass + '[data-row-id="' + rowId + '"]');
    if (cell) cell.innerHTML = html;
  }

  function refreshCells(cellClass, kind, rowId, html) {
    var selector = "." + cellClass + '[data-row-id="' + rowId + '"]';
    if (kind) selector += '[data-kind="' + kind + '"]';
    _.forEach(document.querySelectorAll(selector), function (cell) {
      cell.innerHTML = html;
    });
  }

  function estimateTokens(str) {
    // Rough client-side estimate only — the page has no way to read the
    // request's real token count, so this is chars/4, ceiling.
    var s = _.trim(str);
    return s ? Math.ceil(s.length / 4) : 0;
  }

  function errorCopy(code) {
    switch (code) {
      case "not_granted": return "You haven’t allowed this page to ask Claude.";
      case "rate_limited": return "Too many requests right now — try again shortly.";
      case "refused": return "Claude declined to answer this one.";
      case "empty_completion": return "Got an empty answer — try again.";
      case "invalid_json": return "Couldn’t read that as structured data — try again.";
      case "sampling_disabled": return "Asking Claude is off for this account.";
      case "session_expired": return "Sign in again to keep asking Claude.";
      case "upstream_error": return "A connection hiccup — try again.";
      default: return "Something went wrong asking the model.";
    }
  }

  // ---------- boot ----------

  render();

  var capabilityInit = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("sample").catch(function () { return null; })
    : Promise.resolve(null);

  capabilityInit.then(function (res) {
    sampleAPI = res;
  });

  // Bonus, not required for this browser to keep its own data: if another
  // tab open to this same page saves a change, pick it up here too. This is
  // purely a same-browser convenience (the native "storage" event only ever
  // fires in OTHER tabs/windows, never the one that made the write) — it
  // does nothing across different browsers or devices.
  window.addEventListener("storage", function (e) {
    if (e.key !== STORAGE_KEY || !e.newValue) return;
    try {
      var parsed = JSON.parse(e.newValue);
      if (parsed && _.isArray(parsed.rows)) {
        state = parsed;
        render();
      }
    } catch (err) {
      // corrupt write from elsewhere — ignore, keep showing what we have
    }
  });

  // A width change can reflow how much a clue/hint box needs to wrap to, so
  // re-measure after resizing settles down.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncClueHeights, 150);
  });
})();
</script>

</body></html>
